site_name: BYU CCE Drone Measurements
site_url: https://byu-cce-aerial-measurements.readthedocs.io/en/latest/
site_description: Course materials for the CCE class at BYU
site_author: Instructors and TAs of the CCE class at BYU
repo_url: https://github.com/byu-cce-drones/content/
#favicon: 'images/favicon.ico'
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js
  - js/mathjax-config.js
extra_css:
  - css/custom.css
markdown_extensions:
    - attr_list
    - sane_lists
    - md_in_html
    - admonition
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.details
    - pymdownx.tasklist:
        custom_checkbox: false
        clickable_checkbox: true
    - pymdownx.emoji:

theme:
  name: readthedocs
  logo: images/class_logo.png

nav:
  - Home: index.md

  - Start Here:
      - Syllabus: class_resources/syllabus.md
      - Measurement Fundamentals: gen_reading/measurement_fundamentals.md
      # - Grading Policy: class_resources/grading_policy.md  # reverted 2026-09-04: describes a different course; syllabus is the single source
      - Teaching Assistants:
          - About the TAs: class_resources/ta/tas.md
          - Office Hours: class_resources/ta/ta_hours.md

  - Week 1 — Course Introduction:
      - This Week: weeks/week_01.md
