  <text x="341.0" y="373.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#e74c3c">400 ft</text>
  <rect x="352.0" y="433" width="196" height="26" rx="13" fill="#e9f6ee" stroke="#2f8f4e" stroke-width="1.5"/>
  <text x="450.0" y="450.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f8f4e">No authorization</text>
  <text x="450.0" y="478" text-anchor="middle" font-size="11.5" fill="#555555">Class G below 700 ft.</text>
  <text x="450.0" y="493" text-anchor="middle" font-size="11.5" fill="#555555">Your 400 ft is uncontrolled</text>
  <text x="450.0" y="508" text-anchor="middle" font-size="11.5" fill="#555555">airspace: fly, no permission needed.</text>
  <text x="735.0" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Class E from 1,200 ft AGL</text>
