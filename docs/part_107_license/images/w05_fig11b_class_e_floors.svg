  <text x="735.0" y="508" text-anchor="middle" font-size="11.5" fill="#555555">the same answer: fly.</text>
  <text x="450.0" y="540" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Only surface Class E needs authorization for a drone below 400 ft. Symbols redrawn from the chart legend, not to scale.</text>
