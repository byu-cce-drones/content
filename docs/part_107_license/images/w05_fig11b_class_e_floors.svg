  <text x="56.0" y="373.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#e74c3c">400 ft</text>
  <rect x="67.0" y="433" width="196" height="26" rx="13" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="165.0" y="450.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">Authorization needed</text>
  <text x="165.0" y="478" text-anchor="middle" font-size="11.5" fill="#555555">Controlled from the ground up.</text>
  <text x="165.0" y="493" text-anchor="middle" font-size="11.5" fill="#555555">Ask ATC first: LAANC or</text>
  <text x="165.0" y="508" text-anchor="middle" font-size="11.5" fill="#555555">FAA DroneZone (14 CFR 107.41).</text>
  <text x="450.0" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Class E from 700 ft AGL</text>
