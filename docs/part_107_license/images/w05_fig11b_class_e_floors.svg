  <rect x="637.0" y="433" width="196" height="26" rx="13" fill="#e9f6ee" stroke="#2f8f4e" stroke-width="1.5"/>
  <text x="735.0" y="450.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f8f4e">No authorization</text>
  <text x="735.0" y="478" text-anchor="middle" font-size="11.5" fill="#555555">The default over most of the US.</text>
