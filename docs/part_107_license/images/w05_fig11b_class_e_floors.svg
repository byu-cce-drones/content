  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 11b: Where Class E starts</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Three ways the sectional draws the floor of Class E, and what each one means for a drone at or below 400 ft.</text>
