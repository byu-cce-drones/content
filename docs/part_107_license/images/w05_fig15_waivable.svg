<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="572" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 15: Which rules can be waived?</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">A certificate of waiver (§107.200) can relax only the ten rules listed in §107.205. Everything else in Part 107 stands as written.</text>
  <rect x="30" y="84" width="440" height="432" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="250.0" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90d9">Can be waived (§107.205)</text>
  <rect x="46" y="128" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="147.5" text-anchor="start" font-size="13" fill="#1a1a1a">Flying from a moving vehicle or aircraft</text>
  <text x="438" y="147.5" text-anchor="end" font-size="11.5" fill="#555555">§107.25</text>
  <rect x="46" y="166" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="185.5" text-anchor="start" font-size="13" fill="#1a1a1a">Lights at night and civil twilight</text>
  <text x="438" y="185.5" text-anchor="end" font-size="11.5" fill="#555555">§107.29(a)(2), (b)</text>
  <rect x="46" y="204" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="223.5" text-anchor="start" font-size="13" fill="#1a1a1a">Visual line of sight</text>
  <text x="438" y="223.5" text-anchor="end" font-size="11.5" fill="#555555">§107.31</text>
  <rect x="46" y="242" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="261.5" text-anchor="start" font-size="13" fill="#1a1a1a">Visual observer</text>
  <text x="438" y="261.5" text-anchor="end" font-size="11.5" fill="#555555">§107.33</text>
  <rect x="46" y="280" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="299.5" text-anchor="start" font-size="13" fill="#1a1a1a">One pilot flying several aircraft</text>
  <text x="438" y="299.5" text-anchor="end" font-size="11.5" fill="#555555">§107.35</text>
  <rect x="46" y="318" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="337.5" text-anchor="start" font-size="13" fill="#1a1a1a">Yielding the right of way</text>
  <text x="438" y="337.5" text-anchor="end" font-size="11.5" fill="#555555">§107.37(a)</text>
  <rect x="46" y="356" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="375.5" text-anchor="start" font-size="13" fill="#1a1a1a">Flying over people</text>
  <text x="438" y="375.5" text-anchor="end" font-size="11.5" fill="#555555">§107.39</text>
  <rect x="46" y="394" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="413.5" text-anchor="start" font-size="13" fill="#1a1a1a">Flying in controlled airspace</text>
  <text x="438" y="413.5" text-anchor="end" font-size="11.5" fill="#555555">§107.41</text>
  <rect x="46" y="432" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="451.5" text-anchor="start" font-size="13" fill="#1a1a1a">Altitude, speed, visibility, cloud clearance</text>
  <text x="438" y="451.5" text-anchor="end" font-size="11.5" fill="#555555">§107.51</text>
  <rect x="46" y="470" width="408" height="30" rx="15.0" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="62" y="489.5" text-anchor="start" font-size="13" fill="#1a1a1a">Flying over moving vehicles</text>
  <text x="438" y="489.5" text-anchor="end" font-size="11.5" fill="#555555">§107.145</text>
  <rect x="495" y="84" width="375" height="432" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="682.5" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">Cannot be waived</text>
  <rect x="511" y="128" width="343" height="30" rx="15.0" fill="#fdecea" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="527" y="147.5" text-anchor="start" font-size="13" fill="#1a1a1a">Careless or reckless flying; dropping things</text>
  <text x="838" y="147.5" text-anchor="end" font-size="11.5" fill="#555555">§107.23</text>
  <rect x="511" y="166" width="343" height="30" rx="15.0" fill="#fdecea" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="527" y="185.5" text-anchor="start" font-size="13" fill="#1a1a1a">Alcohol or drugs</text>
  <text x="838" y="185.5" text-anchor="end" font-size="11.5" fill="#555555">§107.27</text>
  <rect x="511" y="204" width="343" height="30" rx="15.0" fill="#fdecea" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="527" y="223.5" text-anchor="start" font-size="13" fill="#1a1a1a">Carrying hazardous material</text>
  <text x="838" y="223.5" text-anchor="end" font-size="11.5" fill="#555555">§107.36</text>
  <rect x="511" y="242" width="343" height="30" rx="15.0" fill="#fdecea" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="527" y="261.5" text-anchor="start" font-size="13" fill="#1a1a1a">Transponder or ADS-B Out switched on</text>
  <text x="838" y="261.5" text-anchor="end" font-size="11.5" fill="#555555">§107.52, .53</text>
  <rect x="511" y="280" width="343" height="30" rx="15.0" fill="#fdecea" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="527" y="299.5" text-anchor="start" font-size="13" fill="#1a1a1a">Registering the aircraft</text>
  <text x="838" y="299.5" text-anchor="end" font-size="11.5" fill="#555555">§107.13</text>
  <text x="682.5" y="352" text-anchor="middle" font-size="12" fill="#555555">…and every other section that is not</text>
  <text x="682.5" y="369" text-anchor="middle" font-size="12" fill="#555555">on the left. The FAA has no form for</text>
  <text x="682.5" y="386" text-anchor="middle" font-size="12" fill="#555555">those, so there is nothing to apply for.</text>
  <text x="682.5" y="428" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">Even a waiver never allows carrying</text>
  <text x="682.5" y="444" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">someone else's property for hire beyond</text>
  <text x="682.5" y="460" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">line of sight or from a moving vehicle</text>
  <text x="682.5" y="476" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">(§107.25, §107.31).</text>
  <text x="450.0" y="540" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">Night flying needs no waiver since April 2021: anti-collision lights visible 3 statute miles and current training (§107.29).</text>
  <text x="450.0" y="558" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">Apply for a waiver through FAA DroneZone with a safety case; the Part 107 waiver is the exam's name for that paperwork.</text>
</svg>
