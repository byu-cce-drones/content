          <circle cx="-30" cy="24" r="5"/>
          <circle cx="30" cy="24" r="5"/>
        </g>
        <rect x="-11" y="-20" width="22" height="40" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <polygon points="0,-37 -11,-21 11,-21" fill="#444444" stroke="#333333" stroke-width="1"/>
      </g>
    </g>
  </g>
  <g transform="translate(105.5,186)">
    <g transform="scale(0.9)">
      <circle cx="0" cy="-14" r="7" fill="#7a8794"/>
      <path d="M-8,3 a8,10 0 0,1 16,0 z" fill="#7a8794"/>
    </g>
  </g>
  <g transform="translate(127.5,186)">
    <g transform="scale(0.9)">
      <circle cx="0" cy="-14" r="7" fill="#7a8794"/>
      <path d="M-8,3 a8,10 0 0,1 16,0 z" fill="#7a8794"/>
    </g>
  </g>
  <g transform="translate(149.5,186)">
    <g transform="scale(0.9)">
      <circle cx="0" cy="-14" r="7" fill="#7a8794"/>
      <path d="M-8,3 a8,10 0 0,1 16,0 z" fill="#7a8794"/>
    </g>
  </g>
  <text x="127.5" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90d9">0.55 lb or less</text>
  <text x="127.5" y="229" text-anchor="middle" font-size="11" fill="#555555">takeoff weight, everything on board</text>
  <text x="38" y="252" text-anchor="start" font-size="11.5" fill="#555555">No Declaration of Compliance</text>
  <text x="38" y="268" text-anchor="start" font-size="11.5" fill="#555555">needed. No exposed rotating</text>
  <text x="38" y="284" text-anchor="start" font-size="11.5" fill="#555555">parts that could cut skin.</text>
  <text x="38" y="300" text-anchor="start" font-size="11.5" fill="#555555"></text>
  <text x="38" y="316" text-anchor="start" font-size="11.5" fill="#555555">Weigh it with everything attached:</text>
  <text x="38" y="332" text-anchor="start" font-size="11.5" fill="#555555">lights, guards, payload.</text>
  <text x="127.5" y="354" text-anchor="middle" font-size="10.5" fill="#555555">§107.110</text>
  <rect x="241" y="84" width="207" height="280" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <rect x="288.5" y="94" width="112" height="26" rx="13" fill="#4a90d9"/>
  <text x="344.5" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Category 2</text>
  <g transform="translate(344.5,150)">
    <g transform="scale(0.42)">
      <g>
        <g stroke="#333333" stroke-width="5" stroke-linecap="round">
          <line x1="-8.4" y1="-12.0" x2="-30" y2="-24"/>
          <line x1="8.4" y1="-12.0" x2="30" y2="-24"/>
          <line x1="-8.4" y1="12.0" x2="-30" y2="24"/>
          <line x1="8.4" y1="12.0" x2="30" y2="24"/>
