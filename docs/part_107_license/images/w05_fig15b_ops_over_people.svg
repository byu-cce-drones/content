<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="504" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 15b: Flying over people, the four categories</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">§107.39 and Subpart D. No category is needed over people taking part, under a covered structure, or inside a stationary vehicle.</text>
  <rect x="24" y="84" width="207" height="280" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <rect x="71.5" y="94" width="112" height="26" rx="13" fill="#4a90d9"/>
  <text x="127.5" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Category 1</text>
  <g transform="translate(127.5,150)">
    <g transform="scale(0.42)">
      <g>
        <g stroke="#333333" stroke-width="5" stroke-linecap="round">
          <line x1="-8.4" y1="-12.0" x2="-30" y2="-24"/>
          <line x1="8.4" y1="-12.0" x2="30" y2="-24"/>
          <line x1="-8.4" y1="12.0" x2="-30" y2="24"/>
