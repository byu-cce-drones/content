          <circle cx="-30" cy="-24" r="5"/>
          <circle cx="30" cy="-24" r="5"/>
          <circle cx="-30" cy="24" r="5"/>
          <circle cx="30" cy="24" r="5"/>
        </g>
        <rect x="-11" y="-20" width="22" height="40" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <polygon points="0,-37 -11,-21 11,-21" fill="#444444" stroke="#333333" stroke-width="1"/>
      </g>
    </g>
  </g>
  <g transform="translate(322.5,186)">
    <g transform="scale(0.9)">
      <circle cx="0" cy="-14" r="7" fill="#7a8794"/>
      <path d="M-8,3 a8,10 0 0,1 16,0 z" fill="#7a8794"/>
    </g>
  </g>
