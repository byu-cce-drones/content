  </g>
  <text x="745" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Never in restricted airspace</text>
  <text x="745" y="296" text-anchor="middle" font-size="12" fill="#555555">no FAA authorization</text>
  <text x="745" y="314" text-anchor="middle" font-size="12" fill="#555555">means no flight</text>
