  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 20: Weight and balance: where the centre of gravity sits</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Loading and performance is about 2 % of the knowledge test: a small but tested topic.</text>
  <rect x="30" y="84" width="270" height="272" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <rect x="90.0" y="97" width="150" height="26" rx="13" fill="#e9f6ee" stroke="#2f8f4e" stroke-width="1.5"/>
  <text x="165.0" y="114.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f8f4e">Balanced</text>
  <line x1="165.0" y1="150" x2="165.0" y2="278" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="165.0" y="146" text-anchor="middle" font-size="10.5" fill="#555555">centre of lift</text>
  <g transform="translate(165.0,212) rotate(0)">
    <g transform="scale(2.0)">
