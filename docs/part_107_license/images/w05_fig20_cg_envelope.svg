  <text x="616" y="296.0" text-anchor="start" font-size="11.5" fill="#555555">The same problem in reverse. The</text>
  <text x="616" y="310.5" text-anchor="start" font-size="11.5" fill="#555555">rear motors carry the load and the</text>
  <text x="616" y="325.0" text-anchor="start" font-size="11.5" fill="#555555">aircraft wants to pitch up.</text>
  <g>
    <circle cx="60" cy="382" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M60,382 L69,382 A9,9 0 0 0 60,373 Z" fill="#1a1a1a"/>
    <path d="M60,382 L51,382 A9,9 0 0 0 60,391 Z" fill="#1a1a1a"/>
  </g>
  <text x="76" y="386" text-anchor="start" font-size="11.5" fill="#555555">centre of gravity (CG): where the aircraft balances</text>
  <g>
    <line x1="440" y1="390" x2="440.0" y2="382.0" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="440,372 445.0,382.0 435.0,382.0" fill="#4a90d9"/>
  </g>
  <text x="452" y="386" text-anchor="start" font-size="11.5" fill="#555555">thrust each motor must give to hold level</text>
  <rect x="30" y="410" width="840" height="50" rx="8" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="450.0" y="431" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Load per the manufacturer’s flight manual; changing the payload changes the CG.</text>
  <text x="450.0" y="450" text-anchor="middle" font-size="12" fill="#1a1a1a">Test question: where are the loading instructions? In the Pilot’s Operating Handbook or UAS Flight Manual.</text>
  <text x="450.0" y="492" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">A camera moved to the front, a bigger battery, a sensor hung off one arm: every change moves the CG and costs control margin.</text>
</svg>
