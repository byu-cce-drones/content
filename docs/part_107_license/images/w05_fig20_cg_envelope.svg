  <text x="46" y="296.0" text-anchor="start" font-size="11.5" fill="#555555">Payload under the centre of lift.</text>
  <text x="46" y="310.5" text-anchor="start" font-size="11.5" fill="#555555">Equal motor effort, level hover,</text>
  <text x="46" y="325.0" text-anchor="start" font-size="11.5" fill="#555555">full margin to fight wind.</text>
  <rect x="315" y="84" width="270" height="272" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <rect x="375.0" y="97" width="150" height="26" rx="13" fill="#fdf3e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450.0" y="114.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#f39c12">Nose-heavy</text>
  <line x1="450.0" y1="150" x2="450.0" y2="278" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="450.0" y="146" text-anchor="middle" font-size="10.5" fill="#555555">centre of lift</text>
