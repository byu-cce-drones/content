      <path d="M26.0,2.0 L17.0,2.0 A9,9 0 0 0 26.0,11.0 Z" fill="#1a1a1a"/>
    </g>
  </g>
  <text x="331" y="296.0" text-anchor="start" font-size="11.5" fill="#555555">Payload mounted forward, so the</text>
  <text x="331" y="310.5" text-anchor="start" font-size="11.5" fill="#555555">front motors work harder just to</text>
  <text x="331" y="325.0" text-anchor="start" font-size="11.5" fill="#555555">hold level: less margin, worse</text>
  <text x="331" y="339.5" text-anchor="start" font-size="11.5" fill="#555555">control, drifts in a gust.</text>
  <rect x="600" y="84" width="270" height="272" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <rect x="660.0" y="97" width="150" height="26" rx="13" fill="#fdf3e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="735.0" y="114.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#f39c12">Tail-heavy</text>
  <line x1="735.0" y1="150" x2="735.0" y2="278" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="735.0" y="146" text-anchor="middle" font-size="10.5" fill="#555555">centre of lift</text>
  <g transform="translate(735.0,212) rotate(-7)">
    <g transform="scale(2.0)">
      <g>
        <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <polygon points="22,-7 32,1 22,9" fill="#444444" stroke="#333333" stroke-width="1"/>
        <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
