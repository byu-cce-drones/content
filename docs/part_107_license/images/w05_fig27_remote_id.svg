<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="552" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 27: Three ways to comply with Remote ID (Part 89)</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Required since 16 September 2023 for any drone that has to be registered. §89.110 built in; §89.115(a) add-on module; §89.115(b) FRIA.</text>
  <rect x="30" y="84" width="540" height="384" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="300" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">1. Standard Remote ID, built into the aircraft (§89.110)</text>
  <text x="300" y="128" text-anchor="middle" font-size="11.5" fill="#555555">broadcasts these message elements from takeoff to shutdown (§89.305)</text>
  <path d="M271.0,217.5 A58,58 0 0 1 329.0,217.5" fill="none" stroke="#4a90d9" stroke-width="2" opacity="0.55"/>
  <path d="M263.0,203.6 A74,74 0 0 1 337.0,203.6" fill="none" stroke="#4a90d9" stroke-width="2" opacity="0.55"/>
  <path d="M255.0,189.7 A90,90 0 0 1 345.0,189.7" fill="none" stroke="#4a90d9" stroke-width="2" opacity="0.55"/>
  <g transform="translate(300,268)">
    <g transform="scale(1.3)">
      <g>
        <g stroke="#333333" stroke-width="5" stroke-linecap="round">
          <line x1="-8.4" y1="-12.0" x2="-30" y2="-24"/>
          <line x1="8.4" y1="-12.0" x2="30" y2="-24"/>
          <line x1="-8.4" y1="12.0" x2="-30" y2="24"/>
          <line x1="8.4" y1="12.0" x2="30" y2="24"/>
        </g>
        <g fill="#e8edf2" stroke="#b6c2cc" stroke-width="1">
          <circle cx="-30" cy="-24" r="15"/>
          <circle cx="30" cy="-24" r="15"/>
          <circle cx="-30" cy="24" r="15"/>
          <circle cx="30" cy="24" r="15"/>
        </g>
        <g fill="#444444">
          <circle cx="-30" cy="-24" r="5"/>
          <circle cx="30" cy="-24" r="5"/>
          <circle cx="-30" cy="24" r="5"/>
          <circle cx="30" cy="24" r="5"/>
        </g>
        <rect x="-11" y="-20" width="22" height="40" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <polygon points="0,-37 -11,-21 11,-21" fill="#444444" stroke="#333333" stroke-width="1"/>
      </g>
    </g>
  </g>
  <line x1="300" y1="318" x2="300" y2="384" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="3 3"/>
  <g transform="translate(300,418)">
    <g transform="scale(1.3)">
      <circle cx="0" cy="-14" r="7" fill="#444444"/>
      <path d="M-8,3 a8,10 0 0,1 16,0 z" fill="#444444"/>
    </g>
  </g>
  <g>
    <!-- leader lines -->
    <g stroke="#4a90d9" stroke-width="1.5" fill="none">
      <line x1="202" y1="168" x2="261" y2="237"/>
      <line x1="398" y1="168" x2="339" y2="237"/>
      <line x1="202" y1="248" x2="286" y2="260"/>
      <line x1="398" y1="248" x2="314" y2="260"/>
      <line x1="202" y1="328" x2="261" y2="299"/>
      <line x1="398" y1="328" x2="339" y2="299"/>
      <line x1="316" y1="410" x2="307" y2="408"/>
    </g>
    <g fill="#4a90d9">
      <circle cx="261" cy="237" r="3"/>
      <circle cx="339" cy="237" r="3"/>
      <circle cx="286" cy="260" r="3"/>
      <circle cx="314" cy="260" r="3"/>
      <circle cx="261" cy="299" r="3"/>
      <circle cx="339" cy="299" r="3"/>
      <circle cx="307" cy="408" r="3"/>
    </g>
  </g>
  <g id="names" fill="#1a1a1a">
    <text x="196" y="172" text-anchor="end">Aircraft ID</text>
    <text x="196" y="188" text-anchor="end" font-size="12" fill="#555555">serial number or session ID</text>
    <text x="404" y="172" text-anchor="start">Time stamp</text>
    <text x="404" y="188" text-anchor="start" font-size="12" fill="#555555">UTC, for each position</text>
    <text x="196" y="252" text-anchor="end">Aircraft position</text>
    <text x="196" y="268" text-anchor="end" font-size="12" fill="#555555">latitude and longitude</text>
    <text x="404" y="252" text-anchor="start">Aircraft altitude</text>
    <text x="404" y="268" text-anchor="start" font-size="12" fill="#555555">geometric, not barometric</text>
    <text x="196" y="332" text-anchor="end">Velocity</text>
    <text x="196" y="348" text-anchor="end" font-size="12" fill="#555555">speed and direction</text>
    <text x="404" y="332" text-anchor="start">Emergency status</text>
    <text x="404" y="348" text-anchor="start" font-size="12" fill="#555555">if the aircraft declares one</text>
    <text x="322" y="414" text-anchor="start">Control station position and altitude</text>
    <text x="322" y="430" text-anchor="start" font-size="12" fill="#555555">where the pilot stands, broadcast too</text>
  </g>
  <rect x="590" y="84" width="280" height="174" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="730.0" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">2. Broadcast module (§89.115(a))</text>
  <text x="606" y="136" text-anchor="start" font-size="11.5" fill="#555555">An add-on for a drone without built-in</text>
  <text x="606" y="152" text-anchor="start" font-size="11.5" fill="#555555">Remote ID. It broadcasts the aircraft's</text>
  <text x="606" y="168" text-anchor="start" font-size="11.5" fill="#555555">ID, position, altitude and velocity, but</text>
  <text x="606" y="184" text-anchor="start" font-size="11.5" fill="#555555">the takeoff location instead of the</text>
  <text x="606" y="200" text-anchor="start" font-size="11.5" fill="#555555">control station (§89.315).</text>
  <text x="606" y="216" text-anchor="start" font-size="11.5" fill="#555555">Keep the aircraft in sight at all times;</text>
  <text x="606" y="232" text-anchor="start" font-size="11.5" fill="#555555">check the module before takeoff.</text>
  <rect x="590" y="276" width="280" height="192" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="730.0" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">3. Fly inside a FRIA (§89.115(b))</text>
  <text x="606" y="328" text-anchor="start" font-size="11.5" fill="#555555">An FAA-Recognized Identification Area,</text>
  <text x="606" y="344" text-anchor="start" font-size="11.5" fill="#555555">usually a model-club or school field.</text>
  <text x="606" y="360" text-anchor="start" font-size="11.5" fill="#555555">No Remote ID equipment is needed, but</text>
  <text x="606" y="376" text-anchor="start" font-size="11.5" fill="#555555">the aircraft and the pilot both stay</text>
  <text x="606" y="392" text-anchor="start" font-size="11.5" fill="#555555">inside the area, and the aircraft stays</text>
  <text x="606" y="408" text-anchor="start" font-size="11.5" fill="#555555">in sight.</text>
  <text x="606" y="436" text-anchor="start" font-size="11.5" font-style="italic" fill="#555555">Not an option on a job site: a FRIA is</text>
  <text x="606" y="452" text-anchor="start" font-size="11.5" font-style="italic" fill="#555555">that one field.</text>
  <rect x="30" y="484" width="840" height="56" rx="10" fill="#fdf3e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450.0" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">If the broadcast stops in flight, land as soon as practicable (§89.110(a)(2), §89.115(a)(4)).</text>
  <text x="450.0" y="528" text-anchor="middle" font-size="12" fill="#555555">The serial number of the aircraft or the module goes on the Certificate of Aircraft Registration (§89.110(b)(4), §89.115(a)(1)).</text>
</svg>
