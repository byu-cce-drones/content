<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="462" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 7: What the knowledge test covers</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">60 scored questions. Weights from the PSI applicant bulletin, effective 29 Sept 2025; older study guides show different ranges.</text>
  <line x1="262" y1="80" x2="262" y2="380" stroke="#b6c2cc" stroke-width="1"/>
  <text x="246" y="104" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a">Regulations</text>
  <rect x="262" y="88" width="432.0" height="22" rx="4" fill="#4a90d9"/>
  <text x="704.0" y="104" font-size="14" fill="#1a1a1a">
    <tspan font-weight="bold">48 %</tspan>
    <tspan fill="#555555" font-size="12" dx="8">about 29 questions</tspan>
  </text>
  <text x="262" y="128" text-anchor="start" font-size="12" fill="#555555">operating rules, certification, waivers, flying over people, Remote ID</text>
  <text x="246" y="170" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a">Operations</text>
  <rect x="262" y="154" width="225.0" height="22" rx="4" fill="#4a90d9"/>
  <text x="497.0" y="170" font-size="14" fill="#1a1a1a">
    <tspan font-weight="bold">25 %</tspan>
    <tspan fill="#555555" font-size="12" dx="8">about 15 questions</tspan>
  </text>
  <text x="262" y="194" text-anchor="start" font-size="12" fill="#555555">radio and airports, emergencies, decision-making, physiology, maintenance</text>
  <text x="246" y="236" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a">Airspace</text>
  <rect x="262" y="220" width="180.0" height="22" rx="4" fill="#4a90d9"/>
  <text x="452.0" y="236" font-size="14" fill="#1a1a1a">
    <tspan font-weight="bold">20 %</tspan>
    <tspan fill="#555555" font-size="12" dx="8">about 12 questions</tspan>
  </text>
  <text x="262" y="260" text-anchor="start" font-size="12" fill="#555555">airspace classes, authorization, reading sectional charts</text>
  <text x="246" y="302" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a">Weather</text>
  <rect x="262" y="286" width="45.0" height="22" rx="4" fill="#4a90d9"/>
  <text x="317.0" y="302" font-size="14" fill="#1a1a1a">
    <tspan font-weight="bold">5 %</tspan>
    <tspan fill="#555555" font-size="12" dx="8">about 3 questions</tspan>
  </text>
  <text x="262" y="326" text-anchor="start" font-size="12" fill="#555555">weather sources and effects, METAR and TAF</text>
  <text x="246" y="368" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a">Loading and Performance</text>
  <rect x="262" y="352" width="18.0" height="22" rx="4" fill="#4a90d9"/>
  <text x="290.0" y="368" font-size="14" fill="#1a1a1a">
    <tspan font-weight="bold">2 %</tspan>
    <tspan fill="#555555" font-size="12" dx="8">about 1 question</tspan>
    <tspan font-weight="bold" font-size="12.5" fill="#f39c12" dx="14">small but tested</tspan>
  </text>
  <text x="262" y="392" text-anchor="start" font-size="12" fill="#555555">weight and balance, density altitude, load factor</text>
  <text x="450.0" y="438" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">Regulations alone are nearly half the test. Five unscored trial questions are mixed in, so the screen shows 65.</text>
</svg>
