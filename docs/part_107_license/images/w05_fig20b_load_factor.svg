  <rect x="450" y="326" width="420" height="190" rx="10" fill="#fdf3e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="660" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Worked example (FAA sample question)</text>
  <text x="470" y="380" text-anchor="start" font-size="12" fill="#1a1a1a">A 33 lb aircraft holds altitude in a 30° banked turn.</text>
  <text x="470" y="397" text-anchor="start" font-size="12" fill="#1a1a1a">What load must its structure support?</text>
  <text x="470" y="428" text-anchor="start" font-size="18" font-weight="bold" fill="#1a1a1a">33 lb × 1.155 ≈ 38 lb</text>
  <text x="470" y="456" text-anchor="start" font-size="11.5" fill="#555555">The test gives you the curve: FAA-CT-8080-2H, Figure 2.</text>
  <text x="470" y="471" text-anchor="start" font-size="11.5" fill="#555555">Read the load factor at the bank angle, multiply by the weight.</text>
  <text x="470" y="486" text-anchor="start" font-size="11.5" fill="#555555">The answer choices are far enough apart that 1.15 is enough.</text>
  <text x="450.0" y="544" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">The same aircraft weighs 33 lb on the ground and has to be built for 66 lb at 60° of bank. Steep turns, hard pull-ups and gusts all add load.</text>
