<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="520" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 16: Reading a METAR</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">An example in the real format, not an actual observation: a winter morning at Provo. Read it group by group.</text>
  <rect x="30" y="88" width="840" height="46" rx="8" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="100" y="119" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">METAR</text>
  <text x="200" y="119" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">KPVU</text>
  <text x="300" y="119" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">211553Z</text>
  <text x="400" y="119" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">34008KT</text>
  <text x="500" y="119" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">10SM</text>
  <text x="600" y="119" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">BKN045</text>
  <text x="700" y="119" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">08/M02</text>
  <text x="800" y="119" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a" font-family="Consolas, 'Courier New', monospace">A3012</text>
  <line x1="100" y1="128" x2="100" y2="178" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="100" cy="128" r="3" fill="#4a90d9"/>
  <rect x="12.0" y="178" width="176" height="108" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="22.0" y="200" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Report type</text>
  <text x="22.0" y="220" text-anchor="start" font-size="11.5" fill="#555555">Routine hourly observation.</text>
  <text x="22.0" y="235" text-anchor="start" font-size="11.5" fill="#555555">SPECI = a special report</text>
  <text x="22.0" y="250" text-anchor="start" font-size="11.5" fill="#555555">when conditions change.</text>
  <line x1="200" y1="128" x2="200" y2="318" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="200" cy="128" r="3" fill="#4a90d9"/>
  <rect x="112.0" y="318" width="176" height="108" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="122.0" y="340" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Station</text>
  <text x="122.0" y="360" text-anchor="start" font-size="11.5" fill="#555555">Provo Municipal Airport.</text>
  <text x="122.0" y="375" text-anchor="start" font-size="11.5" fill="#555555">K + the three-letter US code.</text>
  <line x1="300" y1="128" x2="300" y2="178" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="300" cy="128" r="3" fill="#4a90d9"/>
  <rect x="212.0" y="178" width="176" height="108" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="222.0" y="200" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Day and time, Zulu (UTC)</text>
  <text x="222.0" y="220" text-anchor="start" font-size="11.5" fill="#555555">21st of the month, 15:53 Z.</text>
  <text x="222.0" y="235" text-anchor="start" font-size="11.5" fill="#555555">Utah: 08:53 MST (UTC−7),</text>
  <text x="222.0" y="250" text-anchor="start" font-size="11.5" fill="#555555">Summer: 09:53 MDT (UTC−6).</text>
  <line x1="400" y1="128" x2="400" y2="318" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="400" cy="128" r="3" fill="#4a90d9"/>
  <rect x="312.0" y="318" width="176" height="108" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="322.0" y="340" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Wind</text>
  <text x="322.0" y="360" text-anchor="start" font-size="11.5" fill="#555555">From 340° true at 8 knots.</text>
  <text x="322.0" y="375" text-anchor="start" font-size="11.5" fill="#555555">G15 = gusts to 15 knots:</text>
  <text x="322.0" y="390" text-anchor="start" font-size="11.5" fill="#555555">34008G15KT. Calm is 00000KT.</text>
  <line x1="500" y1="128" x2="500" y2="178" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="500" cy="128" r="3" fill="#4a90d9"/>
  <rect x="412.0" y="178" width="176" height="108" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="422.0" y="200" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Visibility</text>
  <text x="422.0" y="220" text-anchor="start" font-size="11.5" fill="#555555">10 statute miles.</text>
  <text x="422.0" y="235" text-anchor="start" font-size="11.5" fill="#555555">Part 107 needs at least 3 SM.</text>
  <line x1="600" y1="128" x2="600" y2="318" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="600" cy="128" r="3" fill="#4a90d9"/>
  <rect x="512.0" y="318" width="176" height="108" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="522.0" y="340" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Sky condition</text>
  <text x="522.0" y="360" text-anchor="start" font-size="11.5" fill="#555555">Broken clouds, base 4,500 ft AGL.</text>
  <text x="522.0" y="375" text-anchor="start" font-size="11.5" fill="#555555">FEW, SCT, BKN, OVC in eighths;</text>
  <text x="522.0" y="390" text-anchor="start" font-size="11.5" fill="#555555">a ceiling is BKN or OVC only.</text>
  <line x1="700" y1="128" x2="700" y2="178" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="700" cy="128" r="3" fill="#4a90d9"/>
  <rect x="612.0" y="178" width="176" height="108" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="622.0" y="200" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Temperature / dew point</text>
  <text x="622.0" y="220" text-anchor="start" font-size="11.5" fill="#555555">8 °C and −2 °C (M = minus).</text>
  <text x="622.0" y="235" text-anchor="start" font-size="11.5" fill="#555555">Close together means fog or</text>
  <text x="622.0" y="250" text-anchor="start" font-size="11.5" fill="#555555">low cloud is likely.</text>
  <line x1="800" y1="128" x2="800" y2="318" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="800" cy="128" r="3" fill="#4a90d9"/>
  <rect x="712.0" y="318" width="176" height="108" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="722.0" y="340" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Altimeter</text>
  <text x="722.0" y="360" text-anchor="start" font-size="11.5" fill="#555555">30.12 inches of mercury.</text>
  <text x="722.0" y="375" text-anchor="start" font-size="11.5" fill="#555555">Standard is 29.92.</text>
  <rect x="30" y="448" width="840" height="50" rx="8" fill="#fdf3e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450.0" y="468" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Three traps the test sets</text>
  <text x="450.0" y="487" text-anchor="middle" font-size="12" fill="#1a1a1a">Cloud heights are AGL, in hundreds of feet.  ·  Wind is from the direction given, in degrees true.  ·  Times are Zulu, not local.</text>
</svg>
