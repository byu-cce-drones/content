  <text x="240" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">From above</text>
  <rect x="80" y="160" width="320" height="250" fill="#e8f1fb" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="170" y="230" width="140" height="110" fill="#c2cad2" stroke="#333333" stroke-width="1.5"/>
  <text x="240.0" y="290.0" text-anchor="middle" font-size="12" fill="#1a1a1a">building</text>
  <g>
    <line x1="86" y1="170" x2="387.0" y2="170.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="394,170 387.0,173.5 387.0,166.5" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="394" y1="200" x2="93.0" y2="200.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="86,200 93.0,196.5 93.0,203.5" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="86" y1="230" x2="387.0" y2="230.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="394,230 387.0,233.5 387.0,226.5" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="394" y1="260" x2="93.0" y2="260.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="86,260 93.0,256.5 93.0,263.5" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="86" y1="290" x2="387.0" y2="290.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="394,290 387.0,293.5 387.0,286.5" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="394" y1="320" x2="93.0" y2="320.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="86,320 93.0,316.5 93.0,323.5" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="86" y1="350" x2="387.0" y2="350.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="394,350 387.0,353.5 387.0,346.5" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="394" y1="380" x2="93.0" y2="380.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="86,380 93.0,376.5 93.0,383.5" fill="#4a90d9"/>
  </g>
  <g>
    <path d="M80,431 V424 H170 V431" fill="none" stroke="#555555" stroke-width="2"/>
    <text x="125.0" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555">one building height</text>
  </g>
  <g>
    <path d="M310,431 V424 H400 V431" fill="none" stroke="#555555" stroke-width="2"/>
    <text x="355.0" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555">one building height</text>
  </g>
  <text x="240" y="460" text-anchor="middle" font-size="12" fill="#555555">lines run a building height or more past every edge</text>
  <rect x="470" y="84" width="400" height="400" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="670" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">From the side</text>
  <line x1="500" y1="420" x2="840" y2="420" stroke="#9aa7b2" stroke-width="3" stroke-linecap="round"/>
  <rect x="636" y="300" width="68" height="120" fill="#c2cad2" stroke="#333333" stroke-width="1.5"/>
  <path d="M670,184 L600,420 L740,420 Z" fill="#4a90d9" fill-opacity="0.08" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g transform="translate(670,170)">
    <g transform="scale(0.5)">
      <g>
        <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
      </g>
    </g>
  </g>
  <text x="670" y="144" text-anchor="middle" font-size="11.5" fill="#555555">over the roof</text>
