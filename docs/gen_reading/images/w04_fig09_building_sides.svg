<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="560" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Plan for the sides from the start</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">A grid that stops at the footprint sees only the roof. Run the lines well past the building, or add a line the planner will not draw for you.</text>
