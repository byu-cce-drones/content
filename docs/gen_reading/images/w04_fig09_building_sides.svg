  <g transform="translate(540,170)">
    <g transform="scale(0.5)">
      <g>
        <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
      </g>
    </g>
  </g>
  <text x="540" y="144" text-anchor="middle" font-size="11.5" fill="#555555">past the edge</text>
  <line x1="636" y1="300" x2="636" y2="420" stroke="#2f8f4e" stroke-width="5"/>
  <line x1="636" y1="300" x2="704" y2="300" stroke="#2f8f4e" stroke-width="5" stroke-linecap="round"/>
  <line x1="704" y1="300" x2="704" y2="420" stroke="#e74c3c" stroke-width="4" stroke-dasharray="5 4"/>
  <text x="670" y="456" text-anchor="middle" font-size="12" fill="#2f8f4e">the edge of the frame catches the wall, even at nadir</text>
  <text x="450" y="522" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555555">Water towers, bridges, and anything you want as a 3D object: same rule, every side. Or add an oblique line or an orbit outside the planner.</text>
</svg>
