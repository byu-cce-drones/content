<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="470" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Why a thermal image can lie to you</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">The camera measures radiation and converts it to a temperature. How well a surface radiates changes the answer.</text>
  <rect x="30" y="84" width="400" height="340" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="230" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Same temperature, two readings</text>
  <rect x="90" y="300" width="280" height="22" fill="#d94f38" stroke="#333333" stroke-width="1.5"/>
  <text x="230" y="340" text-anchor="middle" font-size="11.5" fill="#555555">one hot plate, both blocks at 40 °C</text>
  <rect x="116" y="224" width="88" height="76" fill="#b9b0a4" stroke="#333333" stroke-width="1.5"/>
  <text x="160" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Painted concrete</text>
  <text x="160" y="226" text-anchor="middle" font-size="10.5" fill="#555555">rough, dull</text>
  <rect x="120" y="240" width="80" height="30" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#d94f38">40 °C</text>
  <text x="160" y="292" text-anchor="middle" font-size="10.5" fill="#555555">emissivity 0.95</text>
  <rect x="256" y="224" width="88" height="76" fill="#c9d2da" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Polished metal</text>
  <text x="300" y="226" text-anchor="middle" font-size="10.5" fill="#555555">shiny</text>
  <rect x="260" y="240" width="80" height="30" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d5a80">22 °C</text>
  <text x="300" y="292" text-anchor="middle" font-size="10.5" fill="#555555">emissivity 0.10</text>
  <text x="230" y="396" text-anchor="middle" font-size="11.5" fill="#555555">The metal is exactly as hot. It just radiates badly,</text>
  <text x="230" y="412" text-anchor="middle" font-size="11.5" fill="#555555">so the camera reads it far too cold.</text>
  <rect x="460" y="84" width="410" height="340" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="665" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">A hotspot that is not hot</text>
  <circle cx="790" cy="168" r="22" fill="#f4d03f" stroke="#d4b02f" stroke-width="2"/>
  <text x="790" y="204" text-anchor="middle" font-size="11" fill="#555555">sun</text>
  <polygon points="520,300 700,254 700,276 520,322" fill="#c9d2da" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="344" font-size="11.5" fill="#555555">bare metal roof</text>
  <g>
    <line x1="772" y1="186" x2="670.6564023547028" y2="253.56239843019816" stroke="#d4b02f" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="664,258 668.4376015698018,250.2341972528468 672.8752031396037,256.8905996075495" fill="#d4b02f"/>
  </g>
  <g>
    <line x1="648" y1="262" x2="558.5923353935949" y2="200.53223058309652" stroke="#d94f38" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="552,196 560.8584506851432,197.23606288629904 556.3262201020466,203.828398279894" fill="#d94f38"/>
  </g>
  <g transform="translate(510,176)">
    <g transform="scale(0.56)">
      <g>
        <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
      </g>
    </g>
  </g>
  <polygon points="616,275 652,266 652,279 616,288" fill="#d94f38" stroke="#333333" stroke-width="1"/>
  <text x="665" y="388" text-anchor="middle" font-size="11.5" fill="#555555">The camera sees reflected sky and sun, not the roof.</text>
  <text x="665" y="404" text-anchor="middle" font-size="11.5" fill="#555555">Check every hotspot against the ordinary photo.</text>
</svg>
