  <rect x="182" y="200" width="150" height="96" rx="3" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="182" y="318" width="60" height="14" fill="#4a90d9" fill-opacity="0.45" stroke="#4a90d9" stroke-width="1.5"/>
  <rect x="242" y="318" width="30" height="14" fill="#c5cdd5" stroke="#555555" stroke-width="1.5"/>
  <text x="230" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a90d9">80% of each photo repeats the one before</text>
  <text x="230" y="382" text-anchor="middle" font-size="12.5" fill="#555555">only the grey 20% is new ground</text>
  <text x="230" y="414" text-anchor="middle" font-size="12" fill="#555555">so every point on the ground is caught by</text>
  <text x="230" y="432" text-anchor="middle" font-size="12" fill="#555555">5 to 9 different photos.</text>
  <rect x="470" y="84" width="400" height="440" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="670" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Side overlap, 70%</text>
  <text x="670" y="134" text-anchor="middle" font-size="11.5" fill="#555555">between one flight line and the next</text>
  <rect x="555" y="180" width="230" height="108" rx="3" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="543" y="196" text-anchor="end" font-size="11" fill="#555555">line 1</text>
  <g>
    <line x1="585" y1="188" x2="747.0" y2="188.0" stroke="#9aa7b2" stroke-width="2" stroke-linecap="round"/>
    <polygon points="755,188 747.0,192.0 747.0,184.0" fill="#9aa7b2"/>
  </g>
  <rect x="555" y="212" width="230" height="108" rx="3" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="543" y="228" text-anchor="end" font-size="11" fill="#555555">line 2</text>
  <g>
    <line x1="755" y1="220" x2="593.0" y2="220.0" stroke="#9aa7b2" stroke-width="2" stroke-linecap="round"/>
    <polygon points="585,220 593.0,216.0 593.0,224.0" fill="#9aa7b2"/>
  </g>
  <rect x="555" y="244" width="230" height="108" rx="3" fill="#4a90d9" fill-opacity="0.18" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="543" y="260" text-anchor="end" font-size="11" fill="#555555">line 3</text>
  <g>
    <line x1="585" y1="252" x2="747.0" y2="252.0" stroke="#9aa7b2" stroke-width="2" stroke-linecap="round"/>
    <polygon points="755,252 747.0,256.0 747.0,248.0" fill="#9aa7b2"/>
  </g>
  <path d="M805,212 V288 M799,212 H811 M799,288 H811" stroke="#4a90d9" stroke-width="2" fill="none"/>
  <text x="817" y="248.0" font-size="13" font-weight="bold" fill="#4a90d9">70%</text>
  <text x="817" y="266.0" font-size="12.5" fill="#4a90d9">shared</text>
  <text x="670" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a90d9">70% of each strip is photographed twice.</text>
  <text x="670" y="424" text-anchor="middle" font-size="12" fill="#555555">Too little sidelap leaves gaps between lines</text>
  <text x="670" y="442" text-anchor="middle" font-size="12" fill="#555555">that no software can fill in afterwards.</text>
  <rect x="30" y="552" width="840" height="148" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="450" y="580" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">What you are trading</text>
  <rect x="150" y="622" width="180" height="18" fill="#e8b4ac" stroke="#ffffff" stroke-width="2"/>
  <rect x="330" y="622" width="240" height="18" fill="#a8cf9f" stroke="#ffffff" stroke-width="2"/>
  <rect x="570" y="622" width="180" height="18" fill="#f0d79a" stroke="#ffffff" stroke-width="2"/>
  <line x1="150" y1="622" x2="150" y2="640" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="656" text-anchor="middle" font-size="11.5" fill="#555555">60%</text>
  <line x1="330" y1="622" x2="330" y2="640" stroke="#ffffff" stroke-width="2"/>
  <text x="330" y="656" text-anchor="middle" font-size="11.5" fill="#555555">70%</text>
  <line x1="450" y1="622" x2="450" y2="640" stroke="#ffffff" stroke-width="2"/>
  <text x="450" y="656" text-anchor="middle" font-size="11.5" fill="#555555">80%</text>
  <line x1="570" y1="622" x2="570" y2="640" stroke="#ffffff" stroke-width="2"/>
  <text x="570" y="656" text-anchor="middle" font-size="11.5" fill="#555555">85%</text>
  <line x1="750" y1="622" x2="750" y2="640" stroke="#ffffff" stroke-width="2"/>
  <text x="750" y="656" text-anchor="middle" font-size="11.5" fill="#555555">90%</text>
  <text x="240" y="614" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">gaps and holes</text>
  <text x="450" y="614" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f8f4e">the usual choice</text>
  <text x="660" y="614" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8860b">slow and expensive</text>
  <g>
    <line x1="150" y1="678" x2="740.0" y2="678.0" stroke="#b6c2cc" stroke-width="2" stroke-linecap="round"/>
    <polygon points="750,678 740.0,683.0 740.0,673.0" fill="#b6c2cc"/>
  </g>
  <text x="764" y="682" font-size="11.5" fill="#555555">more photos</text>
  <text x="450" y="692" text-anchor="middle" font-size="12" fill="#555555">more photos means a better reconstruction, and also more flight time, more batteries and far more processing</text>
</svg>
