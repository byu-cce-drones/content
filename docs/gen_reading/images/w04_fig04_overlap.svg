<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="720" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Why overlap is the number that matters</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Overlap exists so the same point lands in several photos. Without that, there is nothing to triangulate.</text>
  <rect x="30" y="84" width="400" height="440" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="230" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Forward overlap, 80%</text>
  <text x="230" y="134" text-anchor="middle" font-size="11.5" fill="#555555">between one photo and the next</text>
  <line x1="102" y1="160" x2="322" y2="160" stroke="#c5cdd5" stroke-width="2" stroke-dasharray="7 5"/>
  <g transform="translate(167.0,160)">
    <g transform="scale(0.34)">
      <g>
