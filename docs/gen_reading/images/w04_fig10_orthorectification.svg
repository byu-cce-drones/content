<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="520" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Why a photo is not a map, and how the mesh fixes it</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">A camera sees the top of a building further from the centre than its base. Projecting every photo onto the mesh and looking straight down removes that lean.</text>
  <rect x="50" y="84" width="400" height="330" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="250" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">The photo</text>
  <line x1="80" y1="300" x2="420" y2="300" stroke="#9aa7b2" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="290" y="210" width="60" height="90" fill="#c2cad2" stroke="#333333" stroke-width="1.2"/>
  <g transform="translate(190,150)">
    <g transform="rotate(0.0)">
      <rect x="-12.8" y="-7.2" width="25.6" height="14.4" rx="2.4000000000000004" fill="#444444"/>
      <rect x="-4.800000000000001" y="7.2" width="9.600000000000001" height="5.6000000000000005" fill="#444444"/>
      <circle cx="0" cy="14.4" r="3.2" fill="#dceefb" stroke="#444444" stroke-width="1.5"/>
    </g>
  </g>
  <line x1="190" y1="166" x2="290" y2="300" stroke="#2f8f4e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="190" y1="166" x2="290" y2="210" stroke="#f39c12" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="290" y1="314" x2="347.08955223880594" y2="314" stroke="#f39c12" stroke-width="3"/>
  <line x1="290" y1="310" x2="290" y2="318" stroke="#2f8f4e" stroke-width="2"/>
  <text x="318.54477611940297" y="334" text-anchor="middle" font-size="11" fill="#f39c12">the roof lands here in the picture</text>
  <text x="288" y="350" text-anchor="end" font-size="11" fill="#2f8f4e">base</text>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#555555">buildings lean away from the centre of every photo</text>
  <text x="250" y="388" text-anchor="middle" font-size="11" fill="#555555">and two photos disagree about where the roof is</text>
  <rect x="450" y="84" width="400" height="330" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="650" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">The orthophoto</text>
  <line x1="480" y1="300" x2="820" y2="300" stroke="#9aa7b2" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="690" y="210" width="60" height="90" fill="#c2cad2" stroke="#333333" stroke-width="1.2"/>
  <g>
    <line x1="700" y1="140" x2="700.0" y2="197.0" stroke="#4a90d9" stroke-width="1.6" stroke-linecap="round"/>
    <polygon points="700,204 696.5,197.0 703.5,197.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="720" y1="140" x2="720.0" y2="197.0" stroke="#4a90d9" stroke-width="1.6" stroke-linecap="round"/>
    <polygon points="720,204 716.5,197.0 723.5,197.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="740" y1="140" x2="740.0" y2="197.0" stroke="#4a90d9" stroke-width="1.6" stroke-linecap="round"/>
    <polygon points="740,204 736.5,197.0 743.5,197.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="500" y1="140" x2="500.0" y2="288.0" stroke="#4a90d9" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="500,294 497.0,288.0 503.0,288.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="540" y1="140" x2="540.0" y2="288.0" stroke="#4a90d9" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="540,294 537.0,288.0 543.0,288.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="580" y1="140" x2="580.0" y2="288.0" stroke="#4a90d9" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="580,294 577.0,288.0 583.0,288.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="620" y1="140" x2="620.0" y2="288.0" stroke="#4a90d9" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="620,294 617.0,288.0 623.0,288.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="660" y1="140" x2="660.0" y2="288.0" stroke="#4a90d9" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="660,294 657.0,288.0 663.0,288.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="780" y1="140" x2="780.0" y2="288.0" stroke="#4a90d9" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="780,294 777.0,288.0 783.0,288.0" fill="#4a90d9"/>
  </g>
  <g>
    <line x1="810" y1="140" x2="810.0" y2="288.0" stroke="#4a90d9" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="810,294 807.0,288.0 813.0,288.0" fill="#4a90d9"/>
  </g>
  <line x1="690" y1="314" x2="750" y2="314" stroke="#2f8f4e" stroke-width="3"/>
  <text x="720.0" y="334" text-anchor="middle" font-size="11" fill="#2f8f4e">roof directly over the base</text>
  <text x="650" y="372" text-anchor="middle" font-size="11" fill="#555555">every point viewed from straight above, using the</text>
  <text x="650" y="388" text-anchor="middle" font-size="11" fill="#555555">mesh to know where each pixel sits on the ground</text>
  <text x="450.0" y="448" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555555">Orthorectification. Stitch the straightened photos together and the result is the orthomosaic: a picture you can measure on.</text>
  <text x="450.0" y="490" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">Lean that survives into the orthomosaic means the mesh was wrong there, usually from too little overlap.</text>
</svg>
