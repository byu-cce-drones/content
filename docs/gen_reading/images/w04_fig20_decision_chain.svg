<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="400" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Start from what the map must show, not from the drone</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Each choice follows from the one before it. When the plan breaks a hard constraint, go back one step, not to the start.</text>
  <rect x="33.0" y="150" width="124" height="74" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="49.0" cy="166" r="10" fill="#4a90d9"/>
  <text x="49.0" y="170.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">1</text>
  <text x="95.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Smallest feature</text>
  <text x="95.0" y="210" text-anchor="middle" font-size="11" fill="#555555">the map must show</text>
  <g>
    <line x1="159.0" y1="187.0" x2="166.0" y2="187.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="173.0,187.0 166.0,190.5 166.0,183.5" fill="#4a90d9"/>
  </g>
  <rect x="175.0" y="150" width="124" height="74" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="191.0" cy="166" r="10" fill="#4a90d9"/>
  <text x="191.0" y="170.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">2</text>
  <text x="237.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">GSD</text>
  <text x="237.0" y="210" text-anchor="middle" font-size="11" fill="#555555">several pixels across it</text>
  <g>
    <line x1="301.0" y1="187.0" x2="308.0" y2="187.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="315.0,187.0 308.0,190.5 308.0,183.5" fill="#4a90d9"/>
  </g>
  <rect x="317.0" y="150" width="124" height="74" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="333.0" cy="166" r="10" fill="#4a90d9"/>
  <text x="333.0" y="170.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">3</text>
  <text x="379.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Altitude</text>
  <text x="379.0" y="210" text-anchor="middle" font-size="11" fill="#555555">the highest that gives it</text>
  <g>
    <line x1="443.0" y1="187.0" x2="450.0" y2="187.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="457.0,187.0 450.0,190.5 450.0,183.5" fill="#4a90d9"/>
  </g>
  <rect x="459.0" y="150" width="124" height="74" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="475.0" cy="166" r="10" fill="#4a90d9"/>
  <text x="475.0" y="170.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">4</text>
  <text x="521.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Overlap</text>
  <text x="521.0" y="210" text-anchor="middle" font-size="11" fill="#555555">from the site table</text>
  <g>
    <line x1="585.0" y1="187.0" x2="592.0" y2="187.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="599.0,187.0 592.0,190.5 592.0,183.5" fill="#4a90d9"/>
  </g>
  <rect x="601.0" y="150" width="124" height="74" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="617.0" cy="166" r="10" fill="#4a90d9"/>
  <text x="617.0" y="170.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">5</text>
  <text x="663.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Pattern, gimbal</text>
  <text x="663.0" y="210" text-anchor="middle" font-size="11" fill="#555555">grid, cross, oblique</text>
  <g>
    <line x1="727.0" y1="187.0" x2="734.0" y2="187.0" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    <polygon points="741.0,187.0 734.0,190.5 734.0,183.5" fill="#4a90d9"/>
  </g>
  <rect x="743.0" y="150" width="124" height="74" rx="10" fill="#ffffff" stroke="#4a90d9" stroke-width="1.8"/>
  <circle cx="759.0" cy="166" r="10" fill="#4a90d9"/>
  <text x="759.0" y="170.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">6</text>
  <text x="805.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Lines, photos, time</text>
  <text x="805.0" y="210" text-anchor="middle" font-size="11" fill="#555555">and batteries</text>
  <rect x="300" y="262" width="300" height="48" rx="10" fill="#fdf3e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Does it break a hard constraint?</text>
  <text x="450" y="301" text-anchor="middle" font-size="11" fill="#555555">photo cap, flight time, altitude ceiling, airspace</text>
  <path d="M805.0,224 V286 H602" fill="none" stroke="#f39c12" stroke-width="2"/>
  <path d="M300,286 H379.0 V226" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="373.0,234 385.0,234 379.0,225" fill="#f39c12"/>
  <text x="309.0" y="330" text-anchor="start" font-size="11.5" fill="#f39c12">yes: fly higher, or trim side overlap, then recount</text>
  <text x="450" y="372" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555555">The planner draws the lines and counts the photos. The six choices are still yours.</text>
</svg>
