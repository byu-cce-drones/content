<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="420" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Flight time by hand</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">The planner reports path distance. Minutes and batteries are your arithmetic, and the hard constraints are written in minutes.</text>
  <rect x="30" y="84" width="410" height="290" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="235" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Minutes from distance and speed</text>
  <text x="235" y="160" text-anchor="end" font-size="15" fill="#1a1a1a">time (min)  =</text>
  <text x="330" y="148" text-anchor="middle" font-size="14" fill="#1a1a1a">path distance (ft)</text>
  <line x1="250" y1="156" x2="410" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="330" y="176" text-anchor="middle" font-size="14" fill="#1a1a1a">speed (mph) × 88</text>
  <text x="235" y="210" text-anchor="middle" font-size="11.5" fill="#555555">88 ft per minute for every 1 mph</text>
  <text x="235" y="232" text-anchor="middle" font-size="11.5" fill="#555555">(metric: metres ÷ (m/s × 60))</text>
  <rect x="60" y="258" width="350" height="88" rx="8" fill="#e8f1fb" stroke="none"/>
  <text x="235" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">5,280 ft at 10 mph</text>
  <text x="235" y="306" text-anchor="middle" font-size="13.5" fill="#1a1a1a">5,280 ÷ (10 × 88) = 6.0 min</text>
  <text x="235" y="330" text-anchor="middle" font-size="11.5" fill="#555555">plus turns, climb, and the trip to the first line</text>
  <rect x="460" y="84" width="410" height="290" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="665" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Batteries from minutes</text>
  <text x="665" y="160" text-anchor="end" font-size="15" fill="#1a1a1a">batteries  =</text>
  <text x="760" y="148" text-anchor="middle" font-size="14" fill="#1a1a1a">flight time (min)</text>
  <line x1="680" y1="156" x2="840" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="760" y="176" text-anchor="middle" font-size="14" fill="#1a1a1a">battery (min) − reserve</text>
  <text x="665" y="210" text-anchor="middle" font-size="11.5" fill="#555555">round up; a part battery is a whole battery</text>
  <text x="665" y="232" text-anchor="middle" font-size="11.5" fill="#555555">keep a landing reserve of about 20 %</text>
  <rect x="490" y="258" width="350" height="88" rx="8" fill="#e8f1fb" stroke="none"/>
  <text x="665" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">34 min of lines, 25-min battery</text>
  <text x="665" y="306" text-anchor="middle" font-size="13.5" fill="#1a1a1a">34 ÷ (25 − 5) = 1.7  →  2 batteries</text>
  <text x="665" y="330" text-anchor="middle" font-size="11.5" fill="#555555">and a battery swap means a pause in the pattern</text>
  <text x="450" y="398" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555555">A 12-minute limit is a distance limit in disguise: at 10 mph it is 10,560 ft of flight line, and not one foot more.</text>
</svg>
