<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="400" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 4: The three ways a drone can turn</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Every movement a drone makes is a combination of these three rotations plus going up or down.</text>
  <g>
    <rect x="43.0" y="84" width="264" height="288" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="175" y="315" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Pitch</text>
    <text x="175" y="339" text-anchor="middle" font-size="12.5" fill="#555555">nose tips down or up,</text>
    <text x="175" y="356" text-anchor="middle" font-size="12.5" fill="#555555">so it flies forward or back</text>
  </g>
  <g transform="translate(175,204)">
    <g transform="rotate(18)">
      <g transform="scale(0.95)">
        <g>
          <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
          <polygon points="22,-7 32,1 22,9" fill="#444444" stroke="#333333" stroke-width="1"/>
          <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
        </g>
      </g>
    </g>
  </g>
  <g>
    <path d="M116.7,182.8 A62,62 0 0,1 222.5,164.1" fill="none" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="228.922631570242,171.8076126306243 218.66453325778173,167.36110624786724 226.3249776889715,160.93323015100182" fill="#4a90d9"/>
  </g>
  <circle cx="175" cy="204" r="4" fill="#555555"/>
  <text x="175" y="266" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">side view</text>
  <g>
    <rect x="318.0" y="84" width="264" height="288" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="450" y="315" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Roll</text>
    <text x="450" y="339" text-anchor="middle" font-size="12.5" fill="#555555">leans left or right,</text>
    <text x="450" y="356" text-anchor="middle" font-size="12.5" fill="#555555">so it slides sideways</text>
  </g>
  <g transform="translate(450,204)">
    <g transform="rotate(-18)">
      <g transform="scale(0.95)">
        <g>
          <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
          <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
        </g>
      </g>
    </g>
  </g>
  <g>
    <path d="M508.3,182.8 A62,62 0 0,0 402.5,164.1" fill="none" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="396.07736842975794,171.80761263062433 398.67502231102844,160.93323015100185 406.3354667422183,167.36110624786727" fill="#4a90d9"/>
  </g>
  <circle cx="450" cy="204" r="4" fill="#555555"/>
  <text x="450" y="266" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">seen head-on</text>
  <g>
    <rect x="593.0" y="84" width="264" height="288" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="725" y="315" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Yaw</text>
    <text x="725" y="339" text-anchor="middle" font-size="12.5" fill="#555555">spins in place, so the nose</text>
    <text x="725" y="356" text-anchor="middle" font-size="12.5" fill="#555555">points somewhere new</text>
  </g>
  <g transform="translate(725,204)">
    <g transform="scale(0.9)">
      <g>
        <g stroke="#333333" stroke-width="5" stroke-linecap="round">
          <line x1="-8.4" y1="-12.0" x2="-30" y2="-24"/>
          <line x1="8.4" y1="-12.0" x2="30" y2="-24"/>
          <line x1="-8.4" y1="12.0" x2="-30" y2="24"/>
          <line x1="8.4" y1="12.0" x2="30" y2="24"/>
        </g>
        <g fill="#e8edf2" stroke="#b6c2cc" stroke-width="1">
          <circle cx="-30" cy="-24" r="15"/>
          <circle cx="30" cy="-24" r="15"/>
          <circle cx="-30" cy="24" r="15"/>
          <circle cx="30" cy="24" r="15"/>
        </g>
        <g fill="#444444">
          <circle cx="-30" cy="-24" r="5"/>
          <circle cx="30" cy="-24" r="5"/>
          <circle cx="-30" cy="24" r="5"/>
          <circle cx="30" cy="24" r="5"/>
        </g>
        <rect x="-11" y="-20" width="22" height="40" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <polygon points="0,-37 -11,-21 11,-21" fill="#444444" stroke="#333333" stroke-width="1"/>
      </g>
    </g>
  </g>
  <g>
    <path d="M673.0,234.0 A60,60 0 1,1 777.0,234.0" fill="none" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="771.9615242270663,242.6602540378444 772.6313972081441,231.5 781.2916512459885,236.5" fill="#4a90d9"/>
  </g>
  <text x="725" y="266" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">seen from above</text>
</svg>
