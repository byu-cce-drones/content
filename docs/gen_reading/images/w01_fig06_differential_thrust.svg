        <line x1="10.2" y1="-13.5" x2="34" y2="-27"/>
        <line x1="-10.2" y1="13.5" x2="-34" y2="27"/>
        <line x1="10.2" y1="13.5" x2="34" y2="27"/>
      </g>
      <circle cx="-34" cy="-27" r="11" fill="#c3ccd4" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="-27" r="21" fill="#4a90d9" stroke="#333333" stroke-width="1.2"/>
      <circle cx="-34" cy="27" r="21" fill="#4a90d9" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="27" r="11" fill="#c3ccd4" stroke="#333333" stroke-width="1.2"/>
      <rect x="-12" y="-22" width="24" height="44" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
      <g stroke="#444444" stroke-width="3" stroke-linecap="round" fill="none">
        <line x1="-7" y1="-30" x2="0" y2="-40"/>
        <line x1="0" y1="-40" x2="7" y2="-30"/>
      </g>
    </g>
  </g>
  <g>
    <path d="M697.8,222.2 A62,62 0 1,1 810.2,222.2" fill="none" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="805.9649001788654,231.26541009828986 805.6595438610891,220.08924091921986 814.7226217314555,224.31542353662687" fill="#4a90d9"/>
  </g>
  <text x="140" y="402" font-size="13" fill="#555555">Rotor speed:</text>
  <circle cx="258" cy="397" r="6.82" fill="#c3ccd4" stroke="#333333" stroke-width="1.2"/>
  <text x="278" y="402" font-size="13" fill="#555555">slower</text>
  <circle cx="390" cy="397" r="9.3" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
  <text x="410" y="402" font-size="13" fill="#555555">normal</text>
  <circle cx="522" cy="397" r="13.02" fill="#4a90d9" stroke="#333333" stroke-width="1.2"/>
  <text x="542" y="402" font-size="13" fill="#555555">faster</text>
