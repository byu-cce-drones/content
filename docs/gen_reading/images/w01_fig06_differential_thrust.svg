<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="456" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 6: Which motors speed up</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">A drone has no steering. It moves by running some rotors faster than others. The chevron marks the nose.</text>
  <g>
    <rect x="50.0" y="84" width="196" height="268" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="148" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Hover</text>
    <text x="148" y="319" text-anchor="middle" font-size="12.5" fill="#555555">all four rotors</text>
    <text x="148" y="336" text-anchor="middle" font-size="12.5" fill="#555555">at the same speed</text>
  </g>
  <g transform="translate(148,196)">
    <g>
      <g stroke="#333333" stroke-width="5" stroke-linecap="round">
        <line x1="-10.2" y1="-13.5" x2="-34" y2="-27"/>
        <line x1="10.2" y1="-13.5" x2="34" y2="-27"/>
        <line x1="-10.2" y1="13.5" x2="-34" y2="27"/>
        <line x1="10.2" y1="13.5" x2="34" y2="27"/>
      </g>
      <circle cx="-34" cy="-27" r="15" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="-27" r="15" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
      <circle cx="-34" cy="27" r="15" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="27" r="15" fill="#8fa3b5" stroke="#333333" stroke-width="1.2"/>
      <rect x="-12" y="-22" width="24" height="44" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
      <g stroke="#444444" stroke-width="3" stroke-linecap="round" fill="none">
        <line x1="-7" y1="-30" x2="0" y2="-40"/>
        <line x1="0" y1="-40" x2="7" y2="-30"/>
      </g>
    </g>
  </g>
  <g>
    <rect x="252.0" y="84" width="196" height="268" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="350" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Fly forward</text>
    <text x="350" y="319" text-anchor="middle" font-size="12.5" fill="#555555">rear pair faster,</text>
    <text x="350" y="336" text-anchor="middle" font-size="12.5" fill="#555555">so the nose tips down</text>
  </g>
  <g transform="translate(350,196)">
    <g>
      <g stroke="#333333" stroke-width="5" stroke-linecap="round">
        <line x1="-10.2" y1="-13.5" x2="-34" y2="-27"/>
        <line x1="10.2" y1="-13.5" x2="34" y2="-27"/>
        <line x1="-10.2" y1="13.5" x2="-34" y2="27"/>
        <line x1="10.2" y1="13.5" x2="34" y2="27"/>
      </g>
      <circle cx="-34" cy="-27" r="11" fill="#c3ccd4" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="-27" r="11" fill="#c3ccd4" stroke="#333333" stroke-width="1.2"/>
      <circle cx="-34" cy="27" r="21" fill="#4a90d9" stroke="#333333" stroke-width="1.2"/>
      <circle cx="34" cy="27" r="21" fill="#4a90d9" stroke="#333333" stroke-width="1.2"/>
      <rect x="-12" y="-22" width="24" height="44" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
