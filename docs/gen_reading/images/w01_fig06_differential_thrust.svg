  <g>
    <line x1="614" y1="196" x2="626.0" y2="196.0" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="636,196 626.0,201.0 626.0,191.0" fill="#4a90d9"/>
  </g>
  <g>
    <rect x="656.0" y="84" width="196" height="268" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="754" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Turn right</text>
    <text x="754" y="319" text-anchor="middle" font-size="12.5" fill="#555555">one diagonal pair</text>
    <text x="754" y="336" text-anchor="middle" font-size="12.5" fill="#555555">faster than the other</text>
  </g>
  <g transform="translate(754,196)">
    <g>
