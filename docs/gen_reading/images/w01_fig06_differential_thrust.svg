        <line x1="-7" y1="-30" x2="0" y2="-40"/>
        <line x1="0" y1="-40" x2="7" y2="-30"/>
      </g>
    </g>
  </g>
  <g>
    <line x1="350" y1="140" x2="350.0" y2="122.0" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
    <polygon points="350,112 355.0,122.0 345.0,122.0" fill="#4a90d9"/>
  </g>
  <g>
    <rect x="454.0" y="84" width="196" height="268" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
    <text x="552" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Slide right</text>
    <text x="552" y="319" text-anchor="middle" font-size="12.5" fill="#555555">left pair faster,</text>
    <text x="552" y="336" text-anchor="middle" font-size="12.5" fill="#555555">so it leans right</text>
  </g>
  <g transform="translate(552,196)">
