  <line x1="529" y1="176" x2="529" y2="184" stroke="#c5cdd5" stroke-width="1.5"/>
  <line x1="552" y1="176" x2="552" y2="184" stroke="#c5cdd5" stroke-width="1.5"/>
  <line x1="575" y1="176" x2="575" y2="184" stroke="#c5cdd5" stroke-width="1.5"/>
