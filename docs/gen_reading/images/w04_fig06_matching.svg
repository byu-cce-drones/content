  <text x="60" y="406" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Green: fingerprints agree, geometry agrees</text>
  <text x="60" y="428" text-anchor="start" font-size="11.5" fill="#555555">The same corner, the same manhole, the same car,</text>
  <text x="60" y="444" text-anchor="start" font-size="11.5" fill="#555555">shifted the way everything else shifted between</text>
  <text x="60" y="460" text-anchor="start" font-size="11.5" fill="#555555">the two photos. Kept as tie points.</text>
