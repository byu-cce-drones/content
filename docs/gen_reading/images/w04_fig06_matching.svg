  <text x="480" y="406" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Red: fingerprints agree, geometry does not</text>
  <text x="480" y="428" text-anchor="start" font-size="11.5" fill="#555555">Two identical stripes produce identical fingerprints.</text>
  <text x="480" y="444" text-anchor="start" font-size="11.5" fill="#555555">The match points the wrong way compared with every</text>
  <text x="480" y="460" text-anchor="start" font-size="11.5" fill="#555555">other match, so it is thrown out (RANSAC).</text>
  <text x="450.0" y="522" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">A fingerprint is built so that it survives a change of scale and rotation: the next photo was taken from somewhere else.</text>
