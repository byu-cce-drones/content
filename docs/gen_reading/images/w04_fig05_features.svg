<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="520" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Where the software finds its points</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">A tie point has to be findable again in the next photo. Corners and texture are; blank and repeating surfaces are not.</text>
  <rect x="52" y="92" width="396" height="276" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="60" y="100" width="380.0" height="260.0" fill="#e6e8ea"/>
  <polygon points="80.0,120.0 210.0,120.0 210.0,220.0 150.0,220.0 150.0,180.0 80.0,180.0" fill="#c2cad2" stroke="#333333" stroke-width="1.2"/>
  <line x1="90.0" y1="280.0" x2="90.0" y2="340.0" stroke="#ffffff" stroke-width="3.0"/>
  <line x1="112.0" y1="280.0" x2="112.0" y2="340.0" stroke="#ffffff" stroke-width="3.0"/>
  <line x1="134.0" y1="280.0" x2="134.0" y2="340.0" stroke="#ffffff" stroke-width="3.0"/>
  <line x1="156.0" y1="280.0" x2="156.0" y2="340.0" stroke="#ffffff" stroke-width="3.0"/>
  <line x1="178.0" y1="280.0" x2="178.0" y2="340.0" stroke="#ffffff" stroke-width="3.0"/>
  <line x1="200.0" y1="280.0" x2="200.0" y2="340.0" stroke="#ffffff" stroke-width="3.0"/>
  <circle cx="310.0" cy="190.0" r="9.0" fill="#8a8f94" stroke="#333333" stroke-width="1"/>
  <g transform="translate(360.0,300.0)">
    <g transform="scale(0.7)">
      <path d="M-30,4 l7,-13 h32 l9,13 z" fill="#7a8794" stroke="#333333" stroke-width="1.5"/>
      <rect x="-34" y="4" width="68" height="11" rx="4" fill="#8f9aa6" stroke="#333333" stroke-width="1.5"/>
      <circle cx="-18" cy="16" r="6" fill="#444444"/>
      <circle cx="18" cy="16" r="6" fill="#444444"/>
    </g>
  </g>
  <circle cx="390.0" cy="160.0" r="24.0" fill="#8cb87a" stroke="#5f8a4d" stroke-width="1.2"/>
  <circle cx="405.0" cy="148.0" r="14.0" fill="#9cc48a" stroke="none"/>
  <circle cx="80" cy="120" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="210" cy="120" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="210" cy="220" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="150" cy="220" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="150" cy="180" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="80" cy="180" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="310" cy="190" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="360" cy="300" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="390" cy="160" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="378" cy="142" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <circle cx="405" cy="176" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <rect x="260" y="240" width="80" height="60" rx="6" fill="none" stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="82" y="274" width="130" height="72" rx="6" fill="none" stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="480" y="92" width="390" height="390" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="506" cy="124" r="6" fill="none" stroke="#2f8f4e" stroke-width="2"/>
  <text x="522" y="128" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Keypoints: corners, edges that end, texture</text>
  <text x="522" y="148" text-anchor="start" font-size="11.5" fill="#555555">A building corner, a manhole lid, the edge of a</text>
  <text x="522" y="164" text-anchor="start" font-size="11.5" fill="#555555">car, the texture of a tree canopy. Each one</text>
  <text x="522" y="180" text-anchor="start" font-size="11.5" fill="#555555">looks like itself and like nothing nearby.</text>
  <rect x="500" y="206" width="12" height="12" rx="2" fill="none" stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="522" y="217" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Blank asphalt: nothing to grab</text>
  <text x="522" y="237" text-anchor="start" font-size="11.5" fill="#555555">Every pixel looks like every other pixel. The</text>
  <text x="522" y="253" text-anchor="start" font-size="11.5" fill="#555555">software finds no point here, and the model</text>
  <text x="522" y="269" text-anchor="start" font-size="11.5" fill="#555555">will be smooth and vague across it.</text>
  <rect x="500" y="295" width="12" height="12" rx="2" fill="none" stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="522" y="306" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a">Identical stripes: the wrong thing to grab</text>
  <text x="522" y="326" text-anchor="start" font-size="11.5" fill="#555555">Every stripe looks like every other stripe, so a</text>
  <text x="522" y="342" text-anchor="start" font-size="11.5" fill="#555555">point found here is matched to the wrong stripe</text>
  <text x="522" y="358" text-anchor="start" font-size="11.5" fill="#555555">in the next photo. Worse than blank.</text>
  <text x="675" y="404" text-anchor="middle" font-size="11.5" fill="#555555">Thousands of these per photo, found automatically.</text>
  <text x="675" y="422" text-anchor="middle" font-size="11.5" fill="#555555">You never pick them. You fly so that they exist.</text>
  <text x="675" y="458" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">Overcast light helps: no hard shadows that move</text>
  <text x="675" y="474" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">between photos and look like features.</text>
</svg>
