<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="470" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Three flights agree. That does not make them right.</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">One stockpile flown three days running, then measured by a survey crew. Volumes in cubic yards.</text>
  <line x1="40" y1="250" x2="320" y2="250" stroke="#9aa7b2" stroke-width="2"/>
  <path d="M 70 250 Q 130 210 170 155 Q 205 120 240 170 Q 270 210 298 250 Z" fill="#d9c7ad" stroke="#8c7a5e" stroke-width="1.5"/>
  <path d="M 112 220 Q 190 202 256 220" fill="none" stroke="#8c7a5e" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 138 190 Q 190 172 230 190" fill="none" stroke="#8c7a5e" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 170 160 Q 190 142 198 160" fill="none" stroke="#8c7a5e" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="264" x2="320" y2="264" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="180" y="284" text-anchor="middle" font-size="11" fill="#f39c12">base surface: every flight used the same one</text>
  <text x="180" y="300" text-anchor="middle" font-size="11" fill="#f39c12">so every flight is wrong the same way</text>
  <line x1="380" y1="250" x2="860" y2="250" stroke="#9aa7b2" stroke-width="2"/>
  <line x1="380.0" y1="246" x2="380.0" y2="254" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="380.0" y="270" text-anchor="middle" font-size="11" fill="#555555">1,200</text>
  <line x1="448.57142857142856" y1="246" x2="448.57142857142856" y2="254" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="448.57142857142856" y="270" text-anchor="middle" font-size="11" fill="#555555">1,220</text>
  <line x1="517.1428571428571" y1="246" x2="517.1428571428571" y2="254" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="517.1428571428571" y="270" text-anchor="middle" font-size="11" fill="#555555">1,240</text>
  <line x1="585.7142857142857" y1="246" x2="585.7142857142857" y2="254" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="585.7142857142857" y="270" text-anchor="middle" font-size="11" fill="#555555">1,260</text>
  <line x1="654.2857142857142" y1="246" x2="654.2857142857142" y2="254" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="654.2857142857142" y="270" text-anchor="middle" font-size="11" fill="#555555">1,280</text>
  <line x1="722.8571428571429" y1="246" x2="722.8571428571429" y2="254" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="722.8571428571429" y="270" text-anchor="middle" font-size="11" fill="#555555">1,300</text>
  <line x1="791.4285714285713" y1="246" x2="791.4285714285713" y2="254" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="791.4285714285713" y="270" text-anchor="middle" font-size="11" fill="#555555">1,320</text>
  <line x1="860.0" y1="246" x2="860.0" y2="254" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="860.0" y="270" text-anchor="middle" font-size="11" fill="#555555">1,340</text>
  <text x="620.0" y="290" text-anchor="middle" font-size="11" fill="#555555">cubic yards</text>
  <line x1="517.1428571428571" y1="250" x2="517.1428571428571" y2="158" stroke="#27ae60" stroke-width="2"/>
  <circle cx="517.1428571428571" cy="150" r="7" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <text x="504.1428571428571" y="154" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">flight 1  1,240</text>
  <line x1="568.5714285714286" y1="250" x2="568.5714285714286" y2="126" stroke="#27ae60" stroke-width="2"/>
  <circle cx="568.5714285714286" cy="118" r="7" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <text x="581.5714285714286" y="122" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">flight 2  1,255</text>
  <line x1="544.5714285714286" y1="250" x2="544.5714285714286" y2="190" stroke="#27ae60" stroke-width="2"/>
  <circle cx="544.5714285714286" cy="182" r="7" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <text x="557.5714285714286" y="186" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">flight 3  1,248</text>
  <text x="544.5714285714286" y="92" text-anchor="middle" font-size="11" fill="#27ae60">within about 1 % (σ ≈ 8 yd³): precise</text>
  <polygon points="748.1428571428571,236 766.1428571428571,236 757.1428571428571,250" fill="#1a1a1a"/>
  <text x="757.1428571428571" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">survey crew  1,310</text>
  <g>
    <line x1="543.4285714285717" y1="215" x2="743.1428571428571" y2="215.0" stroke="#f39c12" stroke-width="2" stroke-linecap="round"/>
    <polygon points="753.1428571428571,215 743.1428571428571,220.0 743.1428571428571,210.0" fill="#f39c12"/>
  </g>
  <text x="650.2857142857144" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#f39c12">all three about 60 yd³ low (5 %)</text>
  <rect x="30" y="330" width="400" height="92" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="50" y="356" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a">What repeating the flight showed</text>
  <text x="50" y="380" text-anchor="start" font-size="12" fill="#555555">That the method is repeatable. Three flights</text>
  <text x="50" y="397" text-anchor="start" font-size="12" fill="#555555">within 1 % of each other say nothing about</text>
  <text x="50" y="414" text-anchor="start" font-size="12" fill="#555555">whether any of them is close to the truth.</text>
  <rect x="450" y="330" width="420" height="92" rx="10" fill="#fdf3e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="470" y="356" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a">What the survey crew showed</text>
  <text x="470" y="380" text-anchor="start" font-size="12" fill="#555555">A 60 yd³ bias, about six truckloads, that no</text>
  <text x="470" y="397" text-anchor="start" font-size="12" fill="#555555">number of repeat flights would have found.</text>
  <text x="470" y="414" text-anchor="start" font-size="12" fill="#555555">Only a different source tests accuracy.</text>
  <text x="450.0" y="452" text-anchor="middle" font-size="11" fill="#555555">Illustrative figures, not a real survey.</text>
</svg>
