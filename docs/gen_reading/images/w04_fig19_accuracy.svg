<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="500" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Resolution and accuracy are different questions</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">A map can show tiny detail and still sit in the wrong place. Only a surveyed point tells you which you have.</text>
  <rect x="20.0" y="84" width="270" height="300" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="155" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Resolution</text>
  <rect x="77" y="144" width="156" height="104" fill="#d9dde1" stroke="#333333" stroke-width="1.5"/>
  <path d="M89,234 L131,192 L161,212 L217,160" fill="none" stroke="#5a6570" stroke-width="2.5"/>
  <g stroke="#9aa7b2" stroke-width="0.6" opacity="0.9">
    <line x1="90" y1="144" x2="90" y2="248"/>
    <line x1="103" y1="144" x2="103" y2="248"/>
    <line x1="116" y1="144" x2="116" y2="248"/>
    <line x1="129" y1="144" x2="129" y2="248"/>
    <line x1="142" y1="144" x2="142" y2="248"/>
    <line x1="155" y1="144" x2="155" y2="248"/>
    <line x1="168" y1="144" x2="168" y2="248"/>
    <line x1="181" y1="144" x2="181" y2="248"/>
    <line x1="194" y1="144" x2="194" y2="248"/>
    <line x1="207" y1="144" x2="207" y2="248"/>
    <line x1="220" y1="144" x2="220" y2="248"/>
    <line x1="77" y1="157" x2="233" y2="157"/>
    <line x1="77" y1="170" x2="233" y2="170"/>
    <line x1="77" y1="183" x2="233" y2="183"/>
    <line x1="77" y1="196" x2="233" y2="196"/>
    <line x1="77" y1="209" x2="233" y2="209"/>
    <line x1="77" y1="222" x2="233" y2="222"/>
    <line x1="77" y1="235" x2="233" y2="235"/>
  </g>
  <text x="155" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">Can you see it at all?</text>
  <text x="155" y="304" text-anchor="middle" font-size="11.5" fill="#555555">Set by GSD. A 5 mm crack needs</text>
  <text x="155" y="322" text-anchor="middle" font-size="11.5" fill="#555555">pixels of about 1 cm to appear.</text>
  <text x="155" y="352" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">Fly lower to improve it.</text>
  <rect x="315.0" y="84" width="270" height="300" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="450" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Accuracy</text>
  <circle cx="450" cy="196" r="58" fill="none" stroke="#c5cdd5" stroke-width="1.5"/>
  <circle cx="450" cy="196" r="40" fill="none" stroke="#c5cdd5" stroke-width="1.5"/>
  <circle cx="450" cy="196" r="22" fill="none" stroke="#c5cdd5" stroke-width="1.5"/>
  <line x1="382" y1="196" x2="518" y2="196" stroke="#c5cdd5" stroke-width="1"/>
  <line x1="450" y1="128" x2="450" y2="264" stroke="#c5cdd5" stroke-width="1"/>
  <circle cx="450" cy="196" r="4" fill="#2f8f4e"/>
  <text x="460" y="212" font-size="10.5" fill="#2f8f4e">true position</text>
  <circle cx="476" cy="166" r="4" fill="#e74c3c"/>
  <circle cx="484" cy="174" r="4" fill="#e74c3c"/>
  <circle cx="480" cy="158" r="4" fill="#e74c3c"/>
  <circle cx="490" cy="166" r="4" fill="#e74c3c"/>
  <circle cx="474" cy="174" r="4" fill="#e74c3c"/>
  <g>
    <line x1="454" y1="192" x2="470.34314575050763" y2="175.65685424949237" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
    <polygon points="476,170 473.17157287525384,178.48528137423855 467.5147186257614,172.82842712474618" fill="#e74c3c"/>
  </g>
  <text x="450" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">Is it in the right place?</text>
  <text x="450" y="304" text-anchor="middle" font-size="11.5" fill="#555555">Tight measurements can still all be</text>
  <text x="450" y="322" text-anchor="middle" font-size="11.5" fill="#555555">shifted together, and look convincing.</text>
  <text x="450" y="352" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">Flying lower does not fix this.</text>
  <rect x="610.0" y="84" width="270" height="300" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="745" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Ground truth</text>
  <line x1="653" y1="224" x2="837" y2="224" stroke="#9aa7b2" stroke-width="3" stroke-linecap="round"/>
  <rect x="670" y="198" width="26" height="26" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="670" y="198" width="13" height="13" fill="#333333"/>
  <rect x="683" y="211" width="13" height="13" fill="#333333"/>
  <rect x="736" y="198" width="26" height="26" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="736" y="198" width="13" height="13" fill="#333333"/>
  <rect x="749" y="211" width="13" height="13" fill="#333333"/>
  <rect x="798" y="198" width="26" height="26" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <rect x="798" y="198" width="13" height="13" fill="#333333"/>
  <rect x="811" y="211" width="13" height="13" fill="#333333"/>
  <text x="745" y="246" text-anchor="middle" font-size="11" fill="#555555">surveyed targets on the ground</text>
  <text x="745" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">How would you know?</text>
  <text x="745" y="304" text-anchor="middle" font-size="11.5" fill="#555555">Ground control points fix the map to</text>
  <text x="745" y="322" text-anchor="middle" font-size="11.5" fill="#555555">real coordinates. Extra checkpoints,</text>
  <text x="745" y="340" text-anchor="middle" font-size="11.5" fill="#555555">held back, prove how close you got.</text>
  <text x="450" y="456" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">Without ground control, a map with 1 cm pixels can sit several metres from where it belongs.</text>
</svg>
