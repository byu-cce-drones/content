<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="540" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Nadir, oblique, and why you often fly both</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">A camera pointing straight down never sees a wall. That is the whole reason oblique passes exist.</text>
  <rect x="60" y="84" width="380" height="366" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="250" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Nadir, camera at 0</text>
  <line x1="90" y1="320" x2="410" y2="320" stroke="#9aa7b2" stroke-width="3" stroke-linecap="round"/>
  <rect x="216" y="224" width="68" height="96" fill="#c2cad2" stroke="#333333" stroke-width="1.5"/>
  <path d="M250,174 L158,320 L342,320 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="216" y1="224" x2="284" y2="224" stroke="#2f8f4e" stroke-width="5" stroke-linecap="round"/>
  <line x1="216" y1="224" x2="216" y2="320" stroke="#e74c3c" stroke-width="4" stroke-dasharray="5 4"/>
  <line x1="284" y1="224" x2="284" y2="320" stroke="#e74c3c" stroke-width="4" stroke-dasharray="5 4"/>
  <text x="250" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#e74c3c">roof captured, walls missed</text>
  <g transform="translate(250,160)">
    <g transform="">
      <g transform="scale(0.56)">
        <g>
          <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
          <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
        </g>
      </g>
    </g>
  </g>
  <text x="250" y="394" text-anchor="middle" font-size="11" fill="#555555">green: surfaces the camera sees</text>
  <text x="250" y="414" text-anchor="middle" font-size="11" fill="#555555">red dashed: surfaces it cannot</text>
  <rect x="460" y="84" width="380" height="366" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="650" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Oblique, camera at 30 to 45</text>
  <line x1="490" y1="320" x2="810" y2="320" stroke="#9aa7b2" stroke-width="3" stroke-linecap="round"/>
  <rect x="616" y="224" width="68" height="96" fill="#c2cad2" stroke="#333333" stroke-width="1.5"/>
  <path d="M500,164 L586,320 L836,320 L836,250 Z" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="616" y1="224" x2="684" y2="224" stroke="#2f8f4e" stroke-width="5" stroke-linecap="round"/>
  <line x1="616" y1="224" x2="616" y2="320" stroke="#2f8f4e" stroke-width="5"/>
  <line x1="684" y1="224" x2="684" y2="320" stroke="#e74c3c" stroke-width="4" stroke-dasharray="5 4"/>
  <text x="650" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f8f4e">roof and the near wall captured</text>
  <g transform="translate(500,150)">
    <g transform="rotate(18)">
      <g transform="scale(0.56)">
        <g>
          <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
          <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
          <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
          <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
        </g>
      </g>
    </g>
  </g>
  <text x="650" y="394" text-anchor="middle" font-size="11" fill="#555555">green: surfaces the camera sees</text>
  <text x="650" y="414" text-anchor="middle" font-size="11" fill="#555555">red dashed: surfaces it cannot</text>
  <text x="450" y="512" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">One oblique pass still leaves three walls unseen. Orbit the structure, or fly obliques from four directions.</text>
</svg>
