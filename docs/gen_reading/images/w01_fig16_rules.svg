      <rect x="-15" y="-22" width="30" height="15" rx="3" fill="#c2cad2" stroke="#333333" stroke-width="1.5"/>
      <line x1="-15" y1="-14" x2="15" y2="-14" stroke="#333333" stroke-width="1.2"/>
      <line x1="0" y1="-22" x2="0" y2="-32" stroke="#333333" stroke-width="2"/>
    </g>
  </g>
  <text x="745" y="502" text-anchor="middle" font-size="11" fill="#555555">controlled airspace</text>
  <g>
    <circle cx="745" cy="438" r="44" fill="none" stroke="#e74c3c" stroke-width="5"/>
    <line x1="715.08" y1="408.08" x2="774.92" y2="467.92" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="745" y="536" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Never in restricted airspace</text>
  <text x="745" y="560" text-anchor="middle" font-size="12" fill="#555555">no FAA authorization</text>
  <text x="745" y="578" text-anchor="middle" font-size="12" fill="#555555">means no flight</text>
  <text x="450" y="640" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">Daylight only, one aircraft at a time, and never from a moving vehicle.</text>
</svg>
