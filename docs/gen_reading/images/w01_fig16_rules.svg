    </g>
  </g>
  <text x="150" y="332" text-anchor="middle" font-size="12.5" fill="#555555">you</text>
  <g transform="translate(470,200)">
    <g transform="scale(0.78)">
      <g>
        <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
