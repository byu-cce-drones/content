  <line x1="167" y1="270" x2="434" y2="204" stroke="#4a90d9" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="300" y="284" text-anchor="middle" font-size="12.5" fill="#4a90d9">keep it in sight, without binoculars</text>
