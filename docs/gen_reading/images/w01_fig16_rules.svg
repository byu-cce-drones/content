  <line x1="56" y1="132" x2="844" y2="132" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="60" y="120" font-size="13" font-weight="bold" fill="#e74c3c">400 ft (120 m) above the ground</text>
  <g>
    <line x1="806" y1="294" x2="806.0" y2="146.0" stroke="#8fa3b5" stroke-width="2" stroke-linecap="round"/>
    <polygon points="806,138 810.0,146.0 802.0,146.0" fill="#8fa3b5"/>
  </g>
  <g>
