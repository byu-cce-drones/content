  <text x="155" y="578" text-anchor="middle" font-size="12" fill="#555555">in your operation</text>
  <rect x="315.0" y="348" width="270" height="252" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <rect x="358" y="444" width="184" height="26" rx="3" fill="#b9c1c9"/>
