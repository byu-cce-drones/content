  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 16: The rules that apply on every flight</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Keep it in sight, keep it low, and know what you must never fly over. Topic 5 covers the full set.</text>
