  <text x="450" y="536" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Never over moving traffic</text>
  <text x="450" y="560" text-anchor="middle" font-size="12" fill="#555555">roads, rail, and</text>
  <text x="450" y="578" text-anchor="middle" font-size="12" fill="#555555">waterways in use</text>
  <rect x="610.0" y="348" width="270" height="252" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <path d="M649,468 a96,42 0 0,1 192,0" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="8 6"/>
  <g transform="translate(745,444)">
