<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="360" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 3: Three ways to measure an angle in the field</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Every angle is turned at a station, from one line to another.</text>
  <rect x="30" y="64" width="260" height="276" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <rect x="320" y="64" width="260" height="276" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <rect x="610" y="64" width="260" height="276" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="160" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Interior angle</text>
  <text x="450" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Deflection angle</text>
  <text x="740" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Angle to the right</text>
  <polygon points="160.0,123.0 237.9866343362026,179.6606064612543 208.1983906879828,271.3393935387457 111.8016093120172,271.3393935387457 82.0133656637974,179.66060646125433" fill="#dce7f2" stroke="#3d6f9e" stroke-width="2.5"/>
  <g>
    <path d="M 184.3 140.6 A 30 30 0 0 1 135.7 140.6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  </g>
  <text x="160.0" y="173.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">108°</text>
  <circle cx="160.0" cy="123.0" r="4.5" fill="#1a1a1a"/>
  <text x="160" y="312" text-anchor="middle" font-size="12" fill="#555555">Inside a closed figure.</text>
  <text x="160" y="328" text-anchor="middle" font-size="12" fill="#555555">n sides: they sum to (n − 2) × 180°</text>
  <line x1="340" y1="175" x2="450" y2="175" stroke="#3d6f9e" stroke-width="3"/>
  <line x1="450" y1="175" x2="570.0" y2="175.0" stroke="#b9c6d2" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="450" y1="175" x2="552.3940055361239" y2="246.69705454388077" stroke="#3d6f9e" stroke-width="3"/>
  <g>
    <path d="M 520.0 175.0 A 70 70 0 0 1 507.3 215.2" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
    <polygon points="507.34064310022944,215.15035054457323 508.81664682808844,205.1968881823926 516.1890152266893,210.35907610955203" fill="#4a90d9"/>
  </g>
  <circle cx="450" cy="175" r="4.5" fill="#1a1a1a"/>
  <text x="532" y="205" text-anchor="start" font-size="14" font-weight="bold" fill="#4a90d9">35° R</text>
  <text x="540" y="146" text-anchor="middle" font-size="12" fill="#555555">extension of</text>
  <text x="540" y="161" text-anchor="middle" font-size="12" fill="#555555">the previous line</text>
  <text x="450" y="312" text-anchor="middle" font-size="12" fill="#555555">From the previous line, extended.</text>
  <text x="450" y="328" text-anchor="middle" font-size="12" fill="#555555">Always marked R or L. Route surveys.</text>
  <line x1="740" y1="210" x2="649.067332602634" y2="262.50000000000006" stroke="#3d6f9e" stroke-width="3"/>
  <line x1="740" y1="210" x2="792.5" y2="119.06733260263394" stroke="#3d6f9e" stroke-width="3"/>
  <g>
    <path d="M 703.6 231.0 A 42 42 0 0 1 761.0 173.6" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
    <polygon points="761.0,173.62693304105358 750.9557713659401,173.02404735808355 755.4557713659401,165.2298187240236" fill="#4a90d9"/>
  </g>
  <circle cx="740" cy="210" r="4.5" fill="#1a1a1a"/>
  <text x="643.067332602634" y="280.50000000000006" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">backsight</text>
  <text x="796.5" y="111.06733260263394" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">foresight</text>
  <text x="684" y="166" text-anchor="end" font-size="14" font-weight="bold" fill="#4a90d9">150°</text>
  <text x="740" y="312" text-anchor="middle" font-size="12" fill="#555555">Clockwise from backsight to foresight.</text>
  <text x="740" y="328" text-anchor="middle" font-size="12" fill="#555555">The total-station convention.</text>
</svg>
