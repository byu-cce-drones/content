<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="340" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 14: What happens as the battery drains</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">The aircraft starts making decisions for you. Exact percentages vary by model and rise the further away you are.</text>
  <rect x="80" y="130" width="325.6" height="52" fill="#5cb85c" stroke="#ffffff" stroke-width="2"/>
  <text x="242.8" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Normal flying</text>
  <text x="242.8" y="234" text-anchor="middle" font-size="12" fill="#555555">you are in</text>
  <text x="242.8" y="251" text-anchor="middle" font-size="12" fill="#555555">full control</text>
  <rect x="405.6" y="130" width="148.0" height="52" fill="#f0ad4e" stroke="#ffffff" stroke-width="2"/>
  <text x="479.6" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Low battery warning</text>
  <text x="479.6" y="234" text-anchor="middle" font-size="12" fill="#555555">it asks you</text>
  <text x="479.6" y="251" text-anchor="middle" font-size="12" fill="#555555">to come back</text>
  <rect x="553.6" y="130" width="148.0" height="52" fill="#e8873a" stroke="#ffffff" stroke-width="2"/>
  <text x="627.6" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Return to Home</text>
  <text x="627.6" y="234" text-anchor="middle" font-size="12" fill="#555555">it starts flying</text>
  <text x="627.6" y="251" text-anchor="middle" font-size="12" fill="#555555">home by itself</text>
  <rect x="701.6" y="130" width="118.4" height="52" fill="#d9534f" stroke="#ffffff" stroke-width="2"/>
  <text x="760.8000000000001" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Forced landing</text>
  <text x="760.8000000000001" y="234" text-anchor="middle" font-size="12" fill="#555555">it comes down</text>
  <text x="760.8000000000001" y="251" text-anchor="middle" font-size="12" fill="#555555">where it is</text>
  <text x="80" y="116" font-size="12.5" fill="#555555">battery full</text>
  <text x="820" y="116" text-anchor="end" font-size="12.5" fill="#555555">empty</text>
  <g>
    <line x1="170" y1="110" x2="750.0" y2="110.0" stroke="#b6c2cc" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="760,110 750.0,115.0 750.0,105.0" fill="#b6c2cc"/>
  </g>
  <text x="450" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">Plan to land during the green. The moment the aircraft decides for you, you have already left it too late.</text>
</svg>
