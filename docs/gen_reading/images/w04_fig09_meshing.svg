  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Points become triangles</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">A cloud is not a surface. Joining neighbouring points into triangles makes one, and the one rule that matters is how far apart two points may be and still be joined.</text>
