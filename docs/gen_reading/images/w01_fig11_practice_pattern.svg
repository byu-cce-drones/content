  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 11: The box, the first pattern to practice</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Fly it slowly, one side at a time, pausing in a hover at every corner.</text>
