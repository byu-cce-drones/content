  <text x="450" y="350" text-anchor="middle" font-size="12.5" fill="#555555">you</text>
  <text x="450" y="118" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">Keep the nose pointed away from you for every side</text>
  <text x="450" y="440" text-anchor="middle" font-size="12.5" fill="#555555">Then repeat it with the nose always pointing the way you are flying, and notice how different it feels.</text>
