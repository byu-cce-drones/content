  <text x="450.0" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Reflectance, 0 to 1</text>
  <text x="450.0" y="490" text-anchor="middle" font-size="11" fill="#555555">a property of the ground</text>
