  <text x="50" y="118" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Light sensor on top:</text>
  <text x="50" y="136" text-anchor="start" font-size="12.5" fill="#1a1a1a">records how bright the sky is</text>
  <text x="50" y="152" text-anchor="start" font-size="12.5" fill="#1a1a1a">for every photo</text>
  <line x1="150" y1="160" x2="297" y2="211" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="297" cy="211" r="3" fill="#4a90d9"/>
  <text x="50" y="296" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Panel of known reflectance:</text>
  <text x="50" y="314" text-anchor="start" font-size="12.5" fill="#1a1a1a">photographed before and after the flight,</text>
  <text x="50" y="330" text-anchor="start" font-size="12.5" fill="#1a1a1a">hovering low so it fills a third of the frame</text>
  <line x1="200" y1="340" x2="352" y2="392" stroke="#4a90d9" stroke-width="1.5"/>
  <circle cx="352" cy="392" r="3" fill="#4a90d9"/>
  <text x="295.0" y="416" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">the sky brightness and the panel together say how bright “white” was that day</text>
  <rect x="580" y="76" width="290" height="354" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="725.0" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Three rules for the panel shot</text>
  <circle cx="610" cy="145" r="11" fill="#4a90d9"/>
  <text x="610" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="630" y="150" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Near solar noon</text>
  <text x="630" y="168" text-anchor="start" font-size="11.5" fill="#555555">within about 2.5 h of it</text>
  <circle cx="610" cy="207" r="11" fill="#4a90d9"/>
  <text x="610" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="630" y="212" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Panel flat, about a third of the frame</text>
  <text x="630" y="230" text-anchor="start" font-size="11.5" fill="#555555">no shadow from you: sun at your</text>
  <text x="630" y="246" text-anchor="start" font-size="11.5" fill="#555555">back, then step aside</text>
  <circle cx="610" cy="285" r="11" fill="#4a90d9"/>
  <text x="610" y="289" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="630" y="290" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Uniform sky</text>
  <text x="630" y="308" text-anchor="start" font-size="11.5" fill="#555555">clear or completely overcast, not</text>
  <text x="630" y="324" text-anchor="start" font-size="11.5" fill="#555555">partly cloudy</text>
  <text x="725.0" y="384" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">Partly cloudy is the worst case:</text>
  <text x="725.0" y="400" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">the light changes between the panel</text>
  <text x="725.0" y="416" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555555">shot and the photos it corrects.</text>
  <rect x="35.0" y="450" width="250" height="52" rx="8" fill="#ffffff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="160.0" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Raw brightness</text>
  <text x="160.0" y="490" text-anchor="middle" font-size="11" fill="#555555">depends on the sun that day</text>
  <g>
