<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="310" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 3: What a drone can carry</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Most small drones have one fixed camera. Larger aircraft take interchangeable payloads, so one airframe serves many jobs.</text>
  <rect x="20.0" y="70" width="160" height="208" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <g transform="translate(100,132)">
    <g>
      <rect x="-10" y="-30" width="20" height="8" rx="3" fill="#444444"/>
      <rect x="-30" y="-22" width="60" height="42" rx="7" fill="#5a6570" stroke="#333333" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="15" fill="#333333"/>
      <circle cx="0" cy="0" r="11" fill="#2b3a47"/>
      <circle cx="0" cy="0" r="5" fill="#dceefb"/>
      <circle cx="-4" cy="-4" r="2.5" fill="#ffffff"/>
    </g>
  </g>
  <text x="100" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Standard camera</text>
  <text x="100" y="226" text-anchor="middle" font-size="12" fill="#555555">color photos and video,</text>
  <text x="100" y="243" text-anchor="middle" font-size="12" fill="#555555">what your eye sees</text>
  <rect x="195.0" y="70" width="160" height="208" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <g transform="translate(275,132)">
    <g>
      <rect x="-10" y="-30" width="20" height="8" rx="3" fill="#444444"/>
      <rect x="-30" y="-22" width="60" height="42" rx="7" fill="#5a6570" stroke="#333333" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="15" fill="#333333"/>
      <circle cx="0" cy="0" r="11" fill="#c0392b"/>
      <circle cx="0" cy="0" r="7.5" fill="#e67e22"/>
      <circle cx="0" cy="0" r="4" fill="#f4d03f"/>
    </g>
  </g>
  <text x="275" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Thermal</text>
  <text x="275" y="226" text-anchor="middle" font-size="12" fill="#555555">surface temperature,</text>
  <text x="275" y="243" text-anchor="middle" font-size="12" fill="#555555">shown as an image</text>
  <rect x="370.0" y="70" width="160" height="208" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <g transform="translate(450,132)">
    <g>
      <rect x="-10" y="-30" width="20" height="8" rx="3" fill="#444444"/>
      <rect x="-30" y="-22" width="60" height="42" rx="7" fill="#5a6570" stroke="#333333" stroke-width="1.5"/>
      <circle cx="-17" cy="-6" r="6.5" fill="#c0392b" stroke="#333333" stroke-width="1.2"/>
      <circle cx="0" cy="-6" r="6.5" fill="#7b241c" stroke="#333333" stroke-width="1.2"/>
      <circle cx="17" cy="-6" r="6.5" fill="#27ae60" stroke="#333333" stroke-width="1.2"/>
      <circle cx="-9" cy="11" r="6.5" fill="#2980b9" stroke="#333333" stroke-width="1.2"/>
      <circle cx="9" cy="11" r="6.5" fill="#7f8c8d" stroke="#333333" stroke-width="1.2"/>
    </g>
  </g>
  <text x="450" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Multispectral</text>
  <text x="450" y="226" text-anchor="middle" font-size="12" fill="#555555">light beyond visible,</text>
  <text x="450" y="243" text-anchor="middle" font-size="12" fill="#555555">such as near infrared</text>
  <rect x="545.0" y="70" width="160" height="208" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <g transform="translate(625,132)">
    <g>
      <rect x="-19" y="-28" width="38" height="18" rx="5" fill="#5a6570" stroke="#333333" stroke-width="1.5"/>
      <circle cx="0" cy="-19" r="5" fill="#2b3a47"/>
      <line x1="0" y1="-10" x2="-27" y2="18" stroke="#4a90d9" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="-27" cy="18" r="2.6" fill="#4a90d9"/>
      <line x1="0" y1="-10" x2="-14" y2="23" stroke="#4a90d9" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="-14" cy="23" r="2.6" fill="#4a90d9"/>
      <line x1="0" y1="-10" x2="0" y2="25" stroke="#4a90d9" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="0" cy="25" r="2.6" fill="#4a90d9"/>
      <line x1="0" y1="-10" x2="14" y2="23" stroke="#4a90d9" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="14" cy="23" r="2.6" fill="#4a90d9"/>
      <line x1="0" y1="-10" x2="27" y2="18" stroke="#4a90d9" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="27" cy="18" r="2.6" fill="#4a90d9"/>
      <line x1="-32" y1="28" x2="32" y2="28" stroke="#555555" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="625" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">LiDAR</text>
  <text x="625" y="226" text-anchor="middle" font-size="12" fill="#555555">distance, by timing</text>
  <text x="625" y="243" text-anchor="middle" font-size="12" fill="#555555">laser pulses</text>
  <rect x="720.0" y="70" width="160" height="208" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <g transform="translate(800,132)">
    <g>
      <rect x="-19" y="-4" width="38" height="26" rx="5" fill="#5a6570" stroke="#333333" stroke-width="1.5"/>
      <line x1="-11" y1="4" x2="11" y2="4" stroke="#98a4b0" stroke-width="2" stroke-linecap="round"/>
      <line x1="-11" y1="10" x2="11" y2="10" stroke="#98a4b0" stroke-width="2" stroke-linecap="round"/>
      <line x1="-11" y1="16" x2="11" y2="16" stroke="#98a4b0" stroke-width="2" stroke-linecap="round"/>
      <path d="M-11,-8 q6,-7 0,-14 q-6,-7 0,-11" fill="none" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,-8 q6,-7 0,-14 q-6,-7 0,-11" fill="none" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
      <path d="M11,-8 q6,-7 0,-14 q-6,-7 0,-11" fill="none" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <text x="800" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Gas detector</text>
  <text x="800" y="226" text-anchor="middle" font-size="12" fill="#555555">methane, CO and other</text>
  <text x="800" y="243" text-anchor="middle" font-size="12" fill="#555555">gases in the air</text>
</svg>
