<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="452" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Accuracy and precision are two different things</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">The bullseye is the true value. Each dot is one measurement of the same thing.</text>
  <rect x="35" y="76" width="200" height="240" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="135" cy="196" r="78" fill="#eef3f8" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="135" cy="196" r="56" fill="#dce7f2" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="135" cy="196" r="34" fill="#c6d9ec" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="135" cy="196" r="13" fill="#a9c8e4" stroke="#b9c6d2" stroke-width="1"/>
  <line x1="51" y1="196" x2="219" y2="196" stroke="#b9c6d2" stroke-width="1"/>
  <line x1="135" y1="112" x2="135" y2="280" stroke="#b9c6d2" stroke-width="1"/>
  <g fill="#e74c3c" stroke="#ffffff" stroke-width="1.2">
    <circle cx="97" cy="174" r="5.5"/>
    <circle cx="165" cy="162" r="5.5"/>
    <circle cx="179" cy="222" r="5.5"/>
    <circle cx="105" cy="232" r="5.5"/>
    <circle cx="129" cy="148" r="5.5"/>
    <circle cx="145" cy="238" r="5.5"/>
  </g>
  <text x="135" y="348" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">Accurate, not precise</text>
  <text x="135" y="368" text-anchor="middle" font-size="11.5" fill="#555555">Right on average, badly scattered</text>
  <rect x="245" y="76" width="200" height="240" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="345" cy="196" r="78" fill="#eef3f8" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="345" cy="196" r="56" fill="#dce7f2" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="345" cy="196" r="34" fill="#c6d9ec" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="345" cy="196" r="13" fill="#a9c8e4" stroke="#b9c6d2" stroke-width="1"/>
  <line x1="261" y1="196" x2="429" y2="196" stroke="#b9c6d2" stroke-width="1"/>
  <line x1="345" y1="112" x2="345" y2="280" stroke="#b9c6d2" stroke-width="1"/>
  <g fill="#e74c3c" stroke="#ffffff" stroke-width="1.2">
    <circle cx="385" cy="150" r="5.5"/>
    <circle cx="397" cy="158" r="5.5"/>
    <circle cx="389" cy="162" r="5.5"/>
    <circle cx="395" cy="152" r="5.5"/>
    <circle cx="391" cy="156" r="5.5"/>
    <circle cx="383" cy="156" r="5.5"/>
  </g>
  <text x="345" y="348" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">Precise, not accurate</text>
  <text x="345" y="368" text-anchor="middle" font-size="11.5" fill="#555555">Repeatable, and repeatably wrong</text>
  <rect x="455" y="76" width="200" height="240" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="555" cy="196" r="78" fill="#eef3f8" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="555" cy="196" r="56" fill="#dce7f2" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="555" cy="196" r="34" fill="#c6d9ec" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="555" cy="196" r="13" fill="#a9c8e4" stroke="#b9c6d2" stroke-width="1"/>
  <line x1="471" y1="196" x2="639" y2="196" stroke="#b9c6d2" stroke-width="1"/>
  <line x1="555" y1="112" x2="555" y2="280" stroke="#b9c6d2" stroke-width="1"/>
  <g fill="#e74c3c" stroke="#ffffff" stroke-width="1.2">
    <circle cx="559" cy="193" r="5.5"/>
    <circle cx="550" cy="200" r="5.5"/>
    <circle cx="557" cy="202" r="5.5"/>
    <circle cx="552" cy="191" r="5.5"/>
    <circle cx="561" cy="197" r="5.5"/>
    <circle cx="554" cy="194" r="5.5"/>
  </g>
  <text x="555" y="348" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">Accurate and precise</text>
  <text x="555" y="368" text-anchor="middle" font-size="11.5" fill="#555555">What you are aiming for</text>
  <rect x="665" y="76" width="200" height="240" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="765" cy="196" r="78" fill="#eef3f8" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="765" cy="196" r="56" fill="#dce7f2" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="765" cy="196" r="34" fill="#c6d9ec" stroke="#b9c6d2" stroke-width="1"/>
  <circle cx="765" cy="196" r="13" fill="#a9c8e4" stroke="#b9c6d2" stroke-width="1"/>
  <line x1="681" y1="196" x2="849" y2="196" stroke="#b9c6d2" stroke-width="1"/>
  <line x1="765" y1="112" x2="765" y2="280" stroke="#b9c6d2" stroke-width="1"/>
  <g fill="#e74c3c" stroke="#ffffff" stroke-width="1.2">
    <circle cx="775" cy="204" r="5.5"/>
    <circle cx="831" cy="210" r="5.5"/>
    <circle cx="795" cy="256" r="5.5"/>
    <circle cx="835" cy="248" r="5.5"/>
    <circle cx="811" cy="218" r="5.5"/>
    <circle cx="779" cy="242" r="5.5"/>
  </g>
  <text x="765" y="348" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">Neither</text>
  <text x="765" y="368" text-anchor="middle" font-size="11.5" fill="#555555">Scattered, and off as well</text>
  <rect x="30" y="388" width="840" height="46" rx="8" fill="#eef3f8" stroke="#d5dfe8" stroke-width="1"/>
  <text x="450.0" y="406" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Averaging fixes scatter. It does not fix an error that pushes every measurement the same way.</text>
  <text x="450.0" y="424" text-anchor="middle" font-size="11.5" fill="#555555">That is why you need both numbers, and why one of them cannot stand in for the other.</text>
</svg>
