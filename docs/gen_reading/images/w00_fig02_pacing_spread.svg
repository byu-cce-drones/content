  <rect x="30" y="432" width="840" height="46" rx="8" fill="#eef3f8" stroke="#d5dfe8" stroke-width="1"/>
  <text x="450.0" y="450" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Both walkers average about the same count. Only one of them can tell you how far to trust a single walk.</text>
  <text x="450.0" y="468" text-anchor="middle" font-size="11.5" fill="#555555">This figure is only about precision. Accuracy needs the tape.</text>
