<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="520" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Check your method against something you trust</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Four stall lengths taped on the ground, then measured off the orthomosaic. The difference is what you report.</text>
  <rect x="90" y="131.0" width="720" height="88.0" fill="#e8f5ec" stroke="none"/>
  <text x="812" y="135.0" text-anchor="start" font-size="11" fill="#555555">needed:</text>
  <text x="812" y="149.0" text-anchor="start" font-size="11" fill="#555555">within 2 in</text>
  <line x1="90" y1="175" x2="810" y2="175" stroke="#9aa7b2" stroke-width="2"/>
  <text x="812" y="179" text-anchor="start" font-size="11" fill="#555555">taped</text>
  <text x="812" y="193" text-anchor="start" font-size="11" fill="#555555">length</text>
  <polygon points="167,187 185,187 176,175" fill="#1a1a1a"/>
  <line x1="176" y1="175" x2="176" y2="151.2399999999991" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="176" cy="151.2399999999991" r="7" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <text x="176" y="135.2399999999991" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+1.1 in</text>
  <text x="176" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">stall 1</text>
  <text x="176" y="299" text-anchor="middle" font-size="11" fill="#555555">tape 19.33 ft</text>
  <text x="176" y="315" text-anchor="middle" font-size="11" fill="#555555">orthomosaic 19.42 ft</text>
  <polygon points="343,187 361,187 352,175" fill="#1a1a1a"/>
  <line x1="352" y1="175" x2="352" y2="235.7200000000001" stroke="#f39c12" stroke-width="2.5"/>
  <circle cx="352" cy="235.7200000000001" r="7" fill="#f39c12" stroke="#ffffff" stroke-width="1.5"/>
  <text x="352" y="261.72000000000014" text-anchor="middle" font-size="12" font-weight="bold" fill="#f39c12">-2.8 in</text>
  <text x="352" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">stall 2</text>
  <text x="352" y="299" text-anchor="middle" font-size="11" fill="#555555">tape 18.75 ft</text>
  <text x="352" y="315" text-anchor="middle" font-size="11" fill="#555555">orthomosaic 18.52 ft</text>
  <polygon points="519,187 537,187 528,175" fill="#1a1a1a"/>
  <line x1="528" y1="175" x2="528" y2="159.16000000000034" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="528" cy="159.16000000000034" r="7" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <text x="528" y="143.16000000000034" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+0.7 in</text>
  <text x="528" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">stall 3</text>
  <text x="528" y="299" text-anchor="middle" font-size="11" fill="#555555">tape 19.50 ft</text>
  <text x="528" y="315" text-anchor="middle" font-size="11" fill="#555555">orthomosaic 19.56 ft</text>
  <polygon points="695,187 713,187 704,175" fill="#1a1a1a"/>
  <line x1="704" y1="175" x2="704" y2="217.24000000000004" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="704" cy="217.24000000000004" r="7" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <text x="704" y="243.24000000000004" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">-1.9 in</text>
  <text x="704" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">stall 4</text>
  <text x="704" y="299" text-anchor="middle" font-size="11" fill="#555555">tape 19.00 ft</text>
  <text x="704" y="315" text-anchor="middle" font-size="11" fill="#555555">orthomosaic 18.84 ft</text>
  <rect x="30" y="358" width="420" height="92" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="50" y="384" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a">What you report</text>
  <text x="50" y="408" text-anchor="start" font-size="12" fill="#555555">The worst miss is 2.8 in, so on this lot the orthomosaic</text>
  <text x="50" y="425" text-anchor="start" font-size="12" fill="#555555">is good to about ±3 in (7 cm).</text>
  <text x="50" y="442" text-anchor="start" font-size="12" fill="#555555">Not the 1 cm pixel you can see.</text>
  <rect x="470" y="358" width="400" height="92" rx="10" fill="#fdf3e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="490" y="384" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a">Measuring twice is not a check</text>
  <text x="490" y="408" text-anchor="start" font-size="12" fill="#555555">The same tool again only tests precision.</text>
  <text x="490" y="425" text-anchor="start" font-size="12" fill="#555555">A tape, a survey, or an as-built drawing</text>
  <text x="490" y="442" text-anchor="start" font-size="12" fill="#555555">tests accuracy.</text>
  <text x="450.0" y="486" text-anchor="middle" font-size="12.5" fill="#555555">Your method is as good as its worst miss against a source you trust.</text>
</svg>
