  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 19: Which way the antennas must face</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">An antenna radiates from its broad face, not its tip. Pointing the tips at the drone aims the weakest part at it.</text>
