<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 402" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="402" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Your calculator does not know how good your measurement is</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">42 paces at 2.53 ft per pace, with a pace good to about three percent.</text>
  <rect x="60" y="84" width="360" height="96" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <text x="240" y="112" text-anchor="middle" font-size="11.5" fill="#555555">what the calculator says</text>
  <text x="240" y="156" text-anchor="end" font-size="34" font-weight="bold" fill="#1a1a1a">106.</text>
  <text x="240" y="156" text-anchor="start" font-size="34" font-weight="bold" fill="#c3ccd4">26</text>
  <line x1="240" y1="146" x2="288" y2="146" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="264" y="176" text-anchor="middle" font-size="11" fill="#e74c3c">decoration</text>
  <g>
    <line x1="444" y1="132" x2="486.0" y2="132.0" stroke="#b6c2cc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="496,132 486.0,137.0 486.0,127.0" fill="#b6c2cc"/>
  </g>
  <rect x="520" y="84" width="320" height="96" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="2"/>
  <text x="680" y="112" text-anchor="middle" font-size="11.5" fill="#555555">what you report</text>
  <text x="680" y="156" text-anchor="middle" font-size="34" font-weight="bold" fill="#27ae60">106 ± 3 ft</text>
  <line x1="300" y1="268" x2="720" y2="268" stroke="#9aa7b2" stroke-width="2"/>
  <rect x="405" y="250" width="210" height="36" rx="6" fill="#dce7f2" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="510" y1="242" x2="510" y2="294" stroke="#4a90d9" stroke-width="2.5"/>
  <text x="510" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">106</text>
  <text x="405" y="308" text-anchor="middle" font-size="11.5" fill="#555555">103</text>
  <text x="615" y="308" text-anchor="middle" font-size="11.5" fill="#555555">109</text>
  <text x="510" y="330" text-anchor="middle" font-size="11.5" fill="#555555">three percent of 106 ft is about 3 ft, so the answer lives anywhere in here</text>
  <rect x="30" y="336" width="840" height="46" rx="8" fill="#eef3f8" stroke="#d5dfe8" stroke-width="1"/>
  <text x="450.0" y="354" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Quote no more digits than your uncertainty supports, and put the uncertainty next to the number.</text>
  <text x="450.0" y="372" text-anchor="middle" font-size="11.5" fill="#555555">Extra digits do not make a measurement look careful. They make it look unexamined.</text>
</svg>
