<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="752" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Two photos, one pole, and where height comes from</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">The same point sits in a different place in each photo. That difference is what the software turns into 3D.</text>
  <rect x="30" y="82" width="840" height="322" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <line x1="70" y1="330" x2="830" y2="330" stroke="#9aa7b2" stroke-width="3" stroke-linecap="round"/>
  <rect x="445" y="198" width="10" height="132" fill="#5a6570" stroke="#333333" stroke-width="1.5"/>
  <circle cx="450" cy="198" r="7" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  <g stroke="#1a1a1a" stroke-width="1.8">
    <line x1="476" y1="198" x2="476" y2="330"/>
    <line x1="470" y1="198" x2="482" y2="198"/>
    <line x1="470" y1="330" x2="482" y2="330"/>
  </g>
  <text x="488" y="269.0" font-size="14" font-weight="bold" fill="#1a1a1a">h = ?</text>
  <g stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="415" y1="130" x2="450" y2="198"/>
    <line x1="415" y1="130" x2="450" y2="330"/>
  </g>
  <line x1="415" y1="130" x2="415" y2="330" stroke="#b6c2cc" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M415.0,176.0 A46,46 0 0,0 436.1,170.9" fill="none" stroke="#b8860b" stroke-width="2.5"/>
  <text x="353" y="190" text-anchor="end" font-size="12" font-weight="bold" fill="#b8860b">angle A</text>
  <g transform="translate(415,118)">
    <g transform="scale(0.5)">
      <g>
        <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
      </g>
    </g>
  </g>
  <text x="393" y="94" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">position A</text>
  <line x1="415" y1="323" x2="415" y2="337" stroke="#8fa3b5" stroke-width="2"/>
  <g stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="620" y1="130" x2="450" y2="198"/>
    <line x1="620" y1="130" x2="450" y2="330"/>
  </g>
  <line x1="620" y1="130" x2="620" y2="330" stroke="#b6c2cc" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M620.0,186.0 A56,56 0 0,1 568.0,150.8" fill="none" stroke="#b8860b" stroke-width="2.5"/>
  <text x="692" y="200" text-anchor="start" font-size="12" font-weight="bold" fill="#b8860b">angle B</text>
  <g transform="translate(620,118)">
    <g transform="scale(0.5)">
      <g>
        <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
        <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
        <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
      </g>
    </g>
  </g>
  <text x="642" y="94" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">position B</text>
  <line x1="620" y1="323" x2="620" y2="337" stroke="#8fa3b5" stroke-width="2"/>
  <g stroke="#1a1a1a" stroke-width="1.8">
    <line x1="415" y1="356" x2="620" y2="356"/>
    <line x1="415" y1="350" x2="415" y2="362"/>
    <line x1="620" y1="350" x2="620" y2="362"/>
  </g>
  <text x="517.5" y="346" text-anchor="middle" font-size="12" fill="#1a1a1a">distance between the two shots, known from GPS</text>
  <text x="450" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555">Two known camera positions, two measured angles, one unknown height. That is a triangle, and trigonometry solves it.</text>
  <g>
    <rect x="90" y="452" width="330" height="178" rx="3" fill="#e4ead9" stroke="#333333" stroke-width="2"/>
    <path d="M90,580.16 Q255.0,555.24 420,590.84" fill="none" stroke="#c9c2b4" stroke-width="9"/>
    <circle cx="163.0" cy="507.0" r="6" fill="#9aa7b2"/>
    <circle cx="329.0" cy="581.0" r="5" fill="#9aa7b2"/>
    <circle cx="215.0" cy="593.0" r="4" fill="#9aa7b2"/>
    <g stroke="#8fa3b5" stroke-width="1.5">
      <line x1="246.0" y1="541.0" x2="264.0" y2="541.0"/>
      <line x1="255.0" y1="532.0" x2="255.0" y2="550.0"/>
    </g>
    <text x="255.0" y="524.0" text-anchor="middle" font-size="9.5" fill="#8fa3b5">under the drone</text>
    <line x1="273.0" y1="563.0" x2="287.0" y2="541.0" stroke="#5a6570" stroke-width="6" stroke-linecap="round"/>
    <circle cx="287.0" cy="541.0" r="7" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  </g>
  <g>
    <rect x="480" y="452" width="330" height="178" rx="3" fill="#e4ead9" stroke="#333333" stroke-width="2"/>
    <path d="M480,580.16 Q645.0,555.24 810,590.84" fill="none" stroke="#c9c2b4" stroke-width="9"/>
    <circle cx="593.0" cy="501.0" r="6" fill="#9aa7b2"/>
    <circle cx="759.0" cy="575.0" r="5" fill="#9aa7b2"/>
    <circle cx="645.0" cy="597.0" r="4" fill="#9aa7b2"/>
    <g stroke="#8fa3b5" stroke-width="1.5">
      <line x1="636.0" y1="541.0" x2="654.0" y2="541.0"/>
      <line x1="645.0" y1="532.0" x2="645.0" y2="550.0"/>
    </g>
    <text x="645.0" y="524.0" text-anchor="middle" font-size="9.5" fill="#8fa3b5">under the drone</text>
    <line x1="593.0" y1="563.0" x2="513.0" y2="513.0" stroke="#5a6570" stroke-width="6" stroke-linecap="round"/>
    <circle cx="513.0" cy="513.0" r="7" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  </g>
  <text x="255" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555">photo from A</text>
  <text x="645" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555">photo from B</text>
  <text x="255" y="654" text-anchor="middle" font-size="12.5" fill="#1a1a1a">pole nearly underneath, so it looks short</text>
  <text x="645" y="654" text-anchor="middle" font-size="12.5" fill="#1a1a1a">pole off to the side, so it looks long</text>
  <line x1="287.0" y1="541.0" x2="513.0" y2="513.0" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="450" y="684" text-anchor="middle" font-size="12.5" fill="#e74c3c">the circled point is the same top of the same pole, in a different place in each photo</text>
  <text x="450" y="710" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">Knowing where the drone was for each shot, the software works backwards from</text>
  <text x="450" y="730" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">that difference to the height. Millions of points later, you have a 3D model.</text>
</svg>
