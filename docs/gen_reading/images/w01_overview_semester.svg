<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="470" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">The semester at a glance</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Six areas of study. One hour of lecture and one lab a week, and you fly in Week 2, not at the end.</text>
  <line x1="100" y1="60" x2="100" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="60" x2="150" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="60" x2="200" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="250" y1="60" x2="250" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="60" x2="300" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="350" y1="60" x2="350" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="60" x2="400" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="60" x2="450" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="500" y1="60" x2="500" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="550" y1="60" x2="550" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="600" y1="60" x2="600" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="650" y1="60" x2="650" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="700" y1="60" x2="700" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="750" y1="60" x2="750" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="800" y1="60" x2="800" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <line x1="850" y1="60" x2="850" y2="410" stroke="#cccccc" stroke-width="1" opacity="0.5"/>
  <rect x="100" y="100" width="150" height="14" rx="7.0" fill="#dceefb" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="111" cy="107.0" r="11" fill="#4a90d9"/>
  <text x="111" y="111.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="100" y="75" font-size="16" font-weight="bold" fill="#1a1a1a">Fly it</text>
  <text x="100" y="90" font-size="12.5" fill="#555555">meet the aircraft, earn your TRUST certificate, two flying labs</text>
  <rect x="250" y="157" width="100" height="14" rx="7.0" fill="#dceefb" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="261" cy="164.0" r="11" fill="#4a90d9"/>
  <text x="261" y="168.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="250" y="132" font-size="16" font-weight="bold" fill="#1a1a1a">Measure it</text>
  <text x="250" y="147" font-size="12.5" fill="#555555">GIS tools, checklists, and one site measured four different ways</text>
  <rect x="350" y="214" width="100" height="14" rx="7.0" fill="#dceefb" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="361" cy="221.0" r="11" fill="#4a90d9"/>
  <text x="361" y="225.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="350" y="189" font-size="16" font-weight="bold" fill="#1a1a1a">Plan it</text>
  <text x="350" y="204" font-size="12.5" fill="#555555">design a mapping flight, then fly it at Rock Canyon</text>
  <rect x="400" y="271" width="100" height="14" rx="7.0" fill="#dceefb" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="411" cy="278.0" r="11" fill="#4a90d9"/>
  <text x="411" y="282.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <text x="400" y="246" font-size="16" font-weight="bold" fill="#1a1a1a">Process it</text>
  <text x="400" y="261" font-size="12.5" fill="#555555">turn a pile of photos into a map; what other sensors can see</text>
  <line x1="225.0" y1="335.0" x2="500" y2="335.0" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="225.0" cy="335.0" r="6" fill="#4a90d9"/>
  <text x="225.0" y="318" text-anchor="middle" font-size="11" fill="#555555">rules introduced</text>
  <rect x="500" y="328" width="50" height="14" rx="7.0" fill="#dceefb" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="511" cy="335.0" r="11" fill="#4a90d9"/>
  <text x="511" y="339.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">5</text>
  <text x="500" y="303" font-size="16" font-weight="bold" fill="#1a1a1a">Get certified</text>
  <text x="500" y="318" font-size="12.5" fill="#555555">the FAA Part 107 exam</text>
  <rect x="550" y="385" width="300" height="14" rx="7.0" fill="#dceefb" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="561" cy="392.0" r="11" fill="#4a90d9"/>
  <text x="561" y="396.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">6</text>
  <text x="530.4" y="360" font-size="16" font-weight="bold" fill="#1a1a1a">Prove it</text>
  <text x="530.4" y="375" font-size="12.5" fill="#555555">the final project: plan, fly, process, report, present</text>
  <text x="92" y="430" text-anchor="end" font-size="12" fill="#555555">Week</text>
  <rect x="100" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
