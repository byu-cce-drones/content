  <rect x="250" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="275.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">4</text>
  <rect x="300" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="325.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">5</text>
  <rect x="350" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="375.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">6</text>
  <rect x="400" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="425.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">7</text>
  <rect x="450" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="475.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">8</text>
  <rect x="500" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="525.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">9</text>
  <rect x="550" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="575.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">10</text>
  <rect x="600" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="625.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">11</text>
  <rect x="650" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="675.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">12</text>
  <rect x="700" y="410" width="50" height="30" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="725.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">13</text>
  <rect x="750" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="775.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">14</text>
  <rect x="800" y="410" width="50" height="30" fill="#d0d7de" stroke="#ffffff" stroke-width="2"/>
  <text x="825.0" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">15</text>
  <text x="725.0" y="456" text-anchor="middle" font-size="11" fill="#555555">Thanksgiving</text>
  <text x="825.0" y="456" text-anchor="middle" font-size="11" fill="#555555">final presentations</text>
