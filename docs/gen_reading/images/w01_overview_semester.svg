<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="440" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Six weeks, start to finish</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">One hour a week, and you fly in the first lab rather than the last week.</text>
  <rect x="20.0" y="84" width="270" height="158" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="50" cy="110" r="15" fill="#4a90d9"/>
  <text x="50" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <g transform="translate(167,128)">
    <g transform="scale(0.52)">
      <g>
        <g stroke="#333333" stroke-width="5" stroke-linecap="round">
          <line x1="-8.4" y1="-12.0" x2="-30" y2="-24"/>
          <line x1="8.4" y1="-12.0" x2="30" y2="-24"/>
          <line x1="-8.4" y1="12.0" x2="-30" y2="24"/>
          <line x1="8.4" y1="12.0" x2="30" y2="24"/>
        </g>
        <g fill="#e8edf2" stroke="#b6c2cc" stroke-width="1">
          <circle cx="-30" cy="-24" r="15"/>
          <circle cx="30" cy="-24" r="15"/>
          <circle cx="-30" cy="24" r="15"/>
          <circle cx="30" cy="24" r="15"/>
        </g>
        <g fill="#444444">
          <circle cx="-30" cy="-24" r="5"/>
          <circle cx="30" cy="-24" r="5"/>
          <circle cx="-30" cy="24" r="5"/>
          <circle cx="30" cy="24" r="5"/>
        </g>
        <rect x="-11" y="-20" width="22" height="40" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
        <polygon points="0,-37 -11,-21 11,-21" fill="#444444" stroke="#333333" stroke-width="1"/>
      </g>
    </g>
  </g>
  <text x="155" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Fly it</text>
  <text x="155" y="216" text-anchor="middle" font-size="12.5" fill="#555555">meet the aircraft and get it in the air</text>
  <rect x="315.0" y="84" width="270" height="158" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="345" cy="110" r="15" fill="#4a90d9"/>
  <text x="345" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <g transform="translate(462,128)">
    <g>
      <rect x="-30" y="-22" width="60" height="40" rx="4" fill="#5a6570" stroke="#333333" stroke-width="1.5"/>
      <rect x="-24" y="-16" width="48" height="28" rx="2" fill="#dceefb"/>
      <rect x="-40" y="18" width="80" height="7" rx="3" fill="#8f9aa6" stroke="#333333" stroke-width="1.2"/>
    </g>
  </g>
  <text x="450" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Process it</text>
  <text x="450" y="216" text-anchor="middle" font-size="12.5" fill="#555555">turn a pile of photos into a map</text>
  <rect x="610.0" y="84" width="270" height="158" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="640" cy="110" r="15" fill="#4a90d9"/>
  <text x="640" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <g transform="translate(757,128)">
    <g>
      <rect x="-38" y="-12" width="76" height="26" rx="3" fill="#e8d9a8" stroke="#333333" stroke-width="1.5"/>
      <line x1="-30" y1="-12" x2="-30" y2="1" stroke="#333333" stroke-width="1.5"/>
      <line x1="-20" y1="-12" x2="-20" y2="-4" stroke="#333333" stroke-width="1.5"/>
      <line x1="-10" y1="-12" x2="-10" y2="1" stroke="#333333" stroke-width="1.5"/>
      <line x1="0" y1="-12" x2="0" y2="-4" stroke="#333333" stroke-width="1.5"/>
      <line x1="10" y1="-12" x2="10" y2="1" stroke="#333333" stroke-width="1.5"/>
      <line x1="20" y1="-12" x2="20" y2="-4" stroke="#333333" stroke-width="1.5"/>
      <line x1="30" y1="-12" x2="30" y2="1" stroke="#333333" stroke-width="1.5"/>
    </g>
  </g>
  <text x="745" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Measure it</text>
  <text x="745" y="216" text-anchor="middle" font-size="12.5" fill="#555555">measure one site four different ways</text>
  <rect x="20.0" y="258" width="270" height="158" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="50" cy="284" r="15" fill="#4a90d9"/>
  <text x="50" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <g transform="translate(167,302)">
    <g>
      <line x1="-34" y1="-18" x2="34" y2="-18" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-34" y1="-6" x2="34" y2="-6" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-34" y1="6" x2="34" y2="6" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-34" y1="18" x2="34" y2="18" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M34,-18 q10,6 0,12 M-34,-6 q-10,6 0,12 M34,6 q10,6 0,12" fill="none" stroke="#4a90d9" stroke-width="2.5"/>
      <rect x="-40" y="22" width="80" height="5" rx="2" fill="#c2cad2"/>
    </g>
  </g>
  <text x="155" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Plan it</text>
  <text x="155" y="390" text-anchor="middle" font-size="12.5" fill="#555555">design a flight that collects good data</text>
  <rect x="315.0" y="258" width="270" height="158" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="345" cy="284" r="15" fill="#4a90d9"/>
  <text x="345" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
  <g transform="translate(462,302)">
    <g>
      <path d="M0,-26 l26,10 v18 q0,18 -26,26 q-26,-8 -26,-26 v-18 z" fill="#cfe3f7" stroke="#4a90d9" stroke-width="2"/>
      <path d="M-10,2 l7,8 l15,-16" fill="none" stroke="#4a90d9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="450" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Get certified</text>
  <text x="450" y="390" text-anchor="middle" font-size="12.5" fill="#555555">the FAA Part 107 exam</text>
  <rect x="610.0" y="258" width="270" height="158" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="640" cy="284" r="15" fill="#4a90d9"/>
  <text x="640" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
  <g transform="translate(757,302)">
    <g>
      <rect x="-36" y="-18" width="11" height="36" rx="2" fill="#c0392b"/>
      <rect x="-24" y="-18" width="11" height="36" rx="2" fill="#e67e22"/>
      <rect x="-12" y="-18" width="11" height="36" rx="2" fill="#f4d03f"/>
      <rect x="0" y="-18" width="11" height="36" rx="2" fill="#27ae60"/>
      <rect x="12" y="-18" width="11" height="36" rx="2" fill="#2980b9"/>
      <rect x="24" y="-18" width="11" height="36" rx="2" fill="#6c3483"/>
    </g>
  </g>
  <text x="745" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">See more</text>
  <text x="745" y="390" text-anchor="middle" font-size="12.5" fill="#555555">thermal, multispectral, and LiDAR</text>
</svg>
