  <g>
    <line x1="630" y1="360" x2="630.0" y2="202.72514820031833" stroke="#3d6f9e" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="630,192.72514820031833 635.0,202.72514820031833 625.0,202.72514820031833" fill="#3d6f9e"/>
  </g>
  <text x="640" y="316" text-anchor="start" font-size="18" font-weight="bold" fill="#3d6f9e">h</text>
  <text x="640" y="334" text-anchor="start" font-size="12" fill="#555555">ellipsoid height:</text>
  <text x="640" y="348" text-anchor="start" font-size="12" fill="#555555">what GNSS measures</text>
  <g>
    <line x1="760" y1="360" x2="760.0" y2="394.9967962751599" stroke="#e67e22" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="760,403.9967962751599 755.5,394.9967962751599 764.5,394.9967962751599" fill="#e67e22"/>
  </g>
  <text x="750" y="386" text-anchor="end" font-size="16" font-weight="bold" fill="#e67e22">N</text>
  <text x="590.0" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">h = H + N.   At BYU, N = −16.93 m (NGS GEOID18), so h = H − 16.93 m</text>
  <text x="590.0" y="470" text-anchor="middle" font-size="12" fill="#555555">A GNSS height reads about 17 m lower than the plan elevation of the same point.</text>
</svg>
