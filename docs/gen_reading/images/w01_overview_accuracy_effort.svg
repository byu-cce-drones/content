<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="500" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Picking a measurement method</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">There is no best method, only the cheapest one that still answers the question.</text>
  <g>
    <line x1="120" y1="430" x2="820.0" y2="430.0" stroke="#8fa3b5" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="830,430 820.0,435.0 820.0,425.0" fill="#8fa3b5"/>
  </g>
  <g>
    <line x1="120" y1="430" x2="120.0" y2="110.0" stroke="#8fa3b5" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="120,100 125.0,110.0 115.0,110.0" fill="#8fa3b5"/>
  </g>
  <text x="830" y="458" text-anchor="end" font-size="13" fill="#555555">more time, cost and effort</text>
  <g transform="translate(104,108) rotate(-90)">
    <text x="0" y="0" text-anchor="end" font-size="13" fill="#555555">more accurate</text>
  </g>
  <circle cx="178" cy="392" r="10" fill="#8fa3b5" stroke="#333333" stroke-width="1.5"/>
  <text x="178" y="362" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Pacing</text>
  <text x="178" y="379" text-anchor="middle" font-size="11.5" fill="#555555">free, roughly a meter</text>
  <circle cx="268" cy="344" r="10" fill="#8fa3b5" stroke="#333333" stroke-width="1.5"/>
  <text x="268" y="314" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Handheld GPS</text>
  <text x="268" y="331" text-anchor="middle" font-size="11.5" fill="#555555">seconds, a few meters</text>
  <circle cx="356" cy="236" r="10" fill="#8fa3b5" stroke="#333333" stroke-width="1.5"/>
  <text x="356" y="206" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Tape or wheel</text>
  <text x="356" y="223" text-anchor="middle" font-size="11.5" fill="#555555">slow, very accurate, small areas</text>
  <circle cx="566" cy="182" r="20" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="566" cy="182" r="10" fill="#4a90d9" stroke="#333333" stroke-width="1.5"/>
  <text x="566" y="152" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a90d9">Drone survey</text>
  <text x="566" y="169" text-anchor="middle" font-size="11.5" fill="#555555">hours, centimeters, whole site</text>
  <circle cx="760" cy="126" r="10" fill="#8fa3b5" stroke="#333333" stroke-width="1.5"/>
  <text x="760" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Survey crew</text>
  <text x="760" y="113" text-anchor="middle" font-size="11.5" fill="#555555">days, millimeters</text>
  <text x="450" y="476" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">This course is about knowing which dot to reach for, and being able to explain why.</text>
</svg>
