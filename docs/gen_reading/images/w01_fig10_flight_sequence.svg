<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="680" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 10: A flight from start to finish</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">The order matters. Most incidents come from a step skipped on the ground, not from difficult flying.</text>
  <text x="20" y="84" font-size="15" font-weight="bold" fill="#4a90d9">Set up</text>
  <rect x="20.0" y="96" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="50" cy="122" r="14" fill="#4a90d9"/>
  <text x="50" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <g transform="translate(155,156)">
    <g>
      <rect x="-22" y="-17" width="44" height="34" rx="4" fill="#e8edf2" stroke="#333333" stroke-width="1.5"/>
      <g stroke="#b6c2cc" stroke-width="1.2">
        <line x1="-8" y1="-17" x2="-8" y2="17"/>
        <line x1="8" y1="-17" x2="8" y2="17"/>
      </g>
      <path d="M4,-2 a9,9 0 1,1 18,0 c0,7 -9,16 -9,16 c0,0 -9,-9 -9,-16 z" fill="#e74c3c" stroke="#333333" stroke-width="1.2"/>
      <circle cx="13" cy="-2" r="3.4" fill="#ffffff"/>
    </g>
  </g>
  <text x="155" y="206" text-anchor="middle" font-size="12" fill="#555555">Check the site,</text>
  <text x="155" y="224" text-anchor="middle" font-size="12" fill="#555555">the weather and the airspace</text>
  <g>
    <line x1="294.0" y1="171.0" x2="301.0" y2="171.0" stroke="#b6c2cc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="310.0,171.0 301.0,175.5 301.0,166.5" fill="#b6c2cc"/>
  </g>
  <rect x="315.0" y="96" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="345" cy="122" r="14" fill="#4a90d9"/>
  <text x="345" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <g transform="translate(450,156)">
    <g>
      <rect x="-7" y="-13" width="14" height="26" rx="4" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
      <line x1="-4" y1="-8" x2="-20" y2="-15" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-20" cy="-15" r="5" fill="#e8edf2" stroke="#b6c2cc" stroke-width="1.2"/>
      <line x1="4" y1="-8" x2="20" y2="-15" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
      <circle cx="20" cy="-15" r="5" fill="#e8edf2" stroke="#b6c2cc" stroke-width="1.2"/>
      <line x1="-4" y1="8" x2="-20" y2="15" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-20" cy="15" r="5" fill="#e8edf2" stroke="#b6c2cc" stroke-width="1.2"/>
      <line x1="4" y1="8" x2="20" y2="15" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
      <circle cx="20" cy="15" r="5" fill="#e8edf2" stroke="#b6c2cc" stroke-width="1.2"/>
      <path d="M-26,-4 a14,14 0 0,1 6,-13" fill="none" stroke="#4a90d9" stroke-width="2.2" stroke-linecap="round"/>
      <polygon points="-19,-19 -13,-13 -21,-11" fill="#4a90d9"/>
    </g>
  </g>
  <text x="450" y="206" text-anchor="middle" font-size="12" fill="#555555">Unfold the arms, inspect</text>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#555555">the propellers</text>
  <g>
    <line x1="589.0" y1="171.0" x2="596.0" y2="171.0" stroke="#b6c2cc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="605.0,171.0 596.0,175.5 596.0,166.5" fill="#b6c2cc"/>
  </g>
  <rect x="610.0" y="96" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="640" cy="122" r="14" fill="#4a90d9"/>
  <text x="640" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <g transform="translate(745,156)">
    <g>
      <rect x="-20" y="-8" width="36" height="22" rx="3" fill="#c2cad2" stroke="#333333" stroke-width="1.5"/>
      <rect x="16" y="-2" width="5" height="10" rx="2" fill="#333333"/>
      <g stroke="#8fa3b5" stroke-width="3.5" stroke-linecap="round">
        <line x1="-13" y1="-3" x2="-13" y2="9"/>
        <line x1="-4" y1="-3" x2="-4" y2="9"/>
        <line x1="5" y1="-3" x2="5" y2="9"/>
      </g>
      <g>
        <line x1="-2" y1="-28" x2="-2.0" y2="-22.0" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="-2,-14 -6.0,-22.0 2.0,-22.0" fill="#4a90d9"/>
      </g>
    </g>
  </g>
  <text x="745" y="206" text-anchor="middle" font-size="12" fill="#555555">Fit the battery and take</text>
  <text x="745" y="224" text-anchor="middle" font-size="12" fill="#555555">off the gimbal cover</text>
  <text x="20" y="282" font-size="15" font-weight="bold" fill="#4a90d9">Start up</text>
  <rect x="20.0" y="294" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="50" cy="320" r="14" fill="#4a90d9"/>
  <text x="50" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <g transform="translate(155,354)">
    <g>
      <circle cx="0" cy="2" r="16" fill="none" stroke="#4a90d9" stroke-width="3.5"/>
      <rect x="-2.2" y="-22" width="4.4" height="18" rx="2" fill="#f9f9f9"/>
      <line x1="0" y1="-18" x2="0" y2="0" stroke="#4a90d9" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="155" y="404" text-anchor="middle" font-size="12" fill="#555555">Power on the controller,</text>
  <text x="155" y="422" text-anchor="middle" font-size="12" fill="#555555">then the aircraft</text>
  <g>
    <line x1="294.0" y1="369.0" x2="301.0" y2="369.0" stroke="#b6c2cc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="310.0,369.0 301.0,373.5 301.0,364.5" fill="#b6c2cc"/>
  </g>
  <rect x="315.0" y="294" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="345" cy="320" r="14" fill="#4a90d9"/>
  <text x="345" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
  <g transform="translate(450,354)">
    <g>
      <path d="M-10,-4 a10,10 0 0,1 20,0" fill="none" stroke="#4a90d9" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-17,-4 a17,17 0 0,1 34,0" fill="none" stroke="#4a90d9" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-24,-4 a24,24 0 0,1 48,0" fill="none" stroke="#4a90d9" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-11,4 l11,-9 l11,9 v13 h-22 z" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
      <text x="0" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1a1a">H</text>
    </g>
  </g>
  <text x="450" y="404" text-anchor="middle" font-size="12" fill="#555555">Wait for satellites and the</text>
  <text x="450" y="422" text-anchor="middle" font-size="12" fill="#555555">home point message</text>
  <g>
    <line x1="589.0" y1="369.0" x2="596.0" y2="369.0" stroke="#b6c2cc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="605.0,369.0 596.0,373.5 596.0,364.5" fill="#b6c2cc"/>
  </g>
  <rect x="610.0" y="294" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="640" cy="320" r="14" fill="#4a90d9"/>
  <text x="640" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
  <g transform="translate(745,354)">
    <g>
      <line x1="-26" y1="18" x2="26" y2="18" stroke="#555555" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="translate(0,2)">
        <g transform="scale(0.42)">
          <g>
            <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
            <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
            <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
            <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
            <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
            <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
          </g>
        </g>
      </g>
      <g>
        <line x1="24" y1="2" x2="24.0" y2="-12.0" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="24,-20 28.0,-12.0 20.0,-12.0" fill="#4a90d9"/>
      </g>
    </g>
  </g>
  <text x="745" y="404" text-anchor="middle" font-size="12" fill="#555555">Take off, hover at eye level,</text>
  <text x="745" y="422" text-anchor="middle" font-size="12" fill="#555555">check it responds</text>
  <text x="20" y="480" font-size="15" font-weight="bold" fill="#4a90d9">Fly and finish</text>
  <rect x="20.0" y="492" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="50" cy="518" r="14" fill="#4a90d9"/>
  <text x="50" y="523" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">7</text>
  <g transform="translate(155,552)">
    <g>
      <path d="M-2,6 q16,2 22,-10 q4,-8 6,-12" fill="none" stroke="#4a90d9" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>
      <g transform="translate(-18,4)">
        <g transform="scale(0.42)">
          <g>
            <g stroke="#333333" stroke-width="5" stroke-linecap="round">
              <line x1="-8.4" y1="-12.0" x2="-30" y2="-24"/>
              <line x1="8.4" y1="-12.0" x2="30" y2="-24"/>
              <line x1="-8.4" y1="12.0" x2="-30" y2="24"/>
              <line x1="8.4" y1="12.0" x2="30" y2="24"/>
            </g>
            <g fill="#e8edf2" stroke="#b6c2cc" stroke-width="1">
              <circle cx="-30" cy="-24" r="15"/>
              <circle cx="30" cy="-24" r="15"/>
              <circle cx="-30" cy="24" r="15"/>
              <circle cx="30" cy="24" r="15"/>
            </g>
            <g fill="#444444">
              <circle cx="-30" cy="-24" r="5"/>
              <circle cx="30" cy="-24" r="5"/>
              <circle cx="-30" cy="24" r="5"/>
              <circle cx="30" cy="24" r="5"/>
            </g>
            <rect x="-11" y="-20" width="22" height="40" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
            <polygon points="0,-37 -11,-21 11,-21" fill="#444444" stroke="#333333" stroke-width="1"/>
          </g>
        </g>
      </g>
    </g>
  </g>
  <text x="155" y="602" text-anchor="middle" font-size="12" fill="#555555">Fly the job, watching</text>
  <text x="155" y="620" text-anchor="middle" font-size="12" fill="#555555">battery and distance</text>
  <g>
    <line x1="294.0" y1="567.0" x2="301.0" y2="567.0" stroke="#b6c2cc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="310.0,567.0 301.0,571.5 301.0,562.5" fill="#b6c2cc"/>
  </g>
  <rect x="315.0" y="492" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="345" cy="518" r="14" fill="#4a90d9"/>
  <text x="345" y="523" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">8</text>
  <g transform="translate(450,552)">
    <g>
      <line x1="-26" y1="18" x2="26" y2="18" stroke="#555555" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="translate(0,2)">
        <g transform="scale(0.42)">
          <g>
            <rect x="-22" y="-8" width="44" height="18" rx="6" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
            <line x1="-34" y1="-8" x2="-34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="-51" y1="-20" x2="-17" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
            <line x1="-20.4" y1="-2" x2="-34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="34" y1="-8" x2="34" y2="-18" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="17" y1="-20" x2="51" y2="-20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
            <line x1="20.4" y1="-2" x2="34" y2="-10" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="-14" y1="10" x2="-14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
            <line x1="14" y1="10" x2="14" y2="20" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
            <rect x="-6" y="-4" width="10" height="9" rx="3" fill="#444444"/>
          </g>
        </g>
      </g>
      <g>
        <line x1="24" y1="-20" x2="24.0" y2="-6.0" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="24,2 20.0,-6.0 28.0,-6.0" fill="#4a90d9"/>
      </g>
    </g>
  </g>
  <text x="450" y="602" text-anchor="middle" font-size="12" fill="#555555">Land, power off the aircraft,</text>
  <text x="450" y="620" text-anchor="middle" font-size="12" fill="#555555">then the controller</text>
  <g>
    <line x1="589.0" y1="567.0" x2="596.0" y2="567.0" stroke="#b6c2cc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="605.0,567.0 596.0,571.5 596.0,562.5" fill="#b6c2cc"/>
  </g>
  <rect x="610.0" y="492" width="270" height="150" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="640" cy="518" r="14" fill="#4a90d9"/>
  <text x="640" y="523" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">9</text>
  <g transform="translate(745,552)">
    <g>
      <rect x="-28" y="-16" width="20" height="32" rx="3" fill="#c2cad2" stroke="#333333" stroke-width="1.5"/>
      <g stroke="#8fa3b5" stroke-width="2.5">
        <line x1="-24" y1="-16" x2="-24" y2="-9"/>
        <line x1="-19" y1="-16" x2="-19" y2="-9"/>
        <line x1="-14" y1="-16" x2="-14" y2="-9"/>
        <line x1="-9" y1="-16" x2="-9" y2="-9"/>
      </g>
      <g>
        <line x1="-4" y1="0" x2="0.0" y2="0.0" stroke="#4a90d9" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="8,0 0.0,4.0 0.0,-4.0" fill="#4a90d9"/>
      </g>
      <path d="M13,-13 h9 l4,5 h6 v21 h-19 z" fill="#d0d7de" stroke="#333333" stroke-width="1.5"/>
    </g>
  </g>
  <text x="745" y="602" text-anchor="middle" font-size="12" fill="#555555">Copy the images off the card</text>
  <text x="745" y="620" text-anchor="middle" font-size="12" fill="#555555">and log the flight</text>
</svg>
