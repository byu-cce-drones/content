  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 15: What Return to Home actually does</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">It climbs first, then flies a straight line home. It does not steer around anything on the way.</text>
