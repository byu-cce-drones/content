  <polygon points="530,232 504,372 556,372" fill="#7fa87f" stroke="#5f855f" stroke-width="1.5"/>
  <line x1="760" y1="300" x2="150" y2="300" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6 5"/>
