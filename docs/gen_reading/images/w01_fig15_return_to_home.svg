  <text x="376" y="419" font-size="12.5" fill="#555555">fly straight home</text>
  <circle cx="623" cy="414" r="12" fill="#4a90d9"/>
  <text x="623" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="641" y="419" font-size="12.5" fill="#555555">descend and land</text>
  <text x="450" y="456" text-anchor="middle" font-size="13" font-style="italic" fill="#555555">Set the Return to Home altitude above the tallest thing between you and the aircraft, every site, every time.</text>
