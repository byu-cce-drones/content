  <line x1="496" y1="291" x2="514" y2="309" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <text x="645" y="286" text-anchor="middle" font-size="12.5" fill="#e74c3c">RTH altitude set too low</text>
