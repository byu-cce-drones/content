<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="502" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">The decision sets the accuracy, not the equipment</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">Work down the list only as far as the question actually requires.</text>
  <line x1="150" y1="84" x2="150" y2="440" stroke="#b9c6d2" stroke-width="3"/>
  <rect x="178" y="72" width="692" height="58" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="150" cy="100" r="9" fill="#4a90d9"/>
  <text x="128" y="105" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1a1a1a">meters</text>
  <text x="200" y="94" text-anchor="start" font-size="13.5" fill="#1a1a1a">Is there a boulder in this field?</text>
  <text x="200" y="116" text-anchor="start" font-size="11.5" fill="#555555">pacing, or free imagery</text>
  <rect x="178" y="146" width="692" height="58" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="150" cy="174" r="9" fill="#4a90d9"/>
  <text x="128" y="179" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1a1a1a">about 1 m</text>
  <text x="200" y="168" text-anchor="start" font-size="13.5" fill="#1a1a1a">Roughly how much asphalt does this lot need?</text>
  <text x="200" y="190" text-anchor="start" font-size="11.5" fill="#555555">free imagery, or a wheel</text>
  <rect x="178" y="220" width="692" height="58" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="150" cy="248" r="9" fill="#4a90d9"/>
  <text x="128" y="253" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1a1a1a">10 cm</text>
  <text x="200" y="242" text-anchor="start" font-size="13.5" fill="#1a1a1a">How much fill was moved this week?</text>
  <text x="200" y="264" text-anchor="start" font-size="11.5" fill="#555555">aerial survey with ground control</text>
  <rect x="178" y="294" width="692" height="58" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="150" cy="322" r="9" fill="#4a90d9"/>
  <text x="128" y="327" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1a1a1a">1 cm</text>
  <text x="200" y="316" text-anchor="start" font-size="13.5" fill="#1a1a1a">Does this pipe fall the whole way to the outlet?</text>
  <text x="200" y="338" text-anchor="start" font-size="11.5" fill="#555555">level, or survey-grade GNSS</text>
  <rect x="178" y="368" width="692" height="58" rx="10" fill="#ffffff" stroke="#dde3e9" stroke-width="1.5"/>
  <circle cx="150" cy="396" r="9" fill="#4a90d9"/>
  <text x="128" y="401" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1a1a1a">1 mm</text>
  <text x="200" y="390" text-anchor="start" font-size="13.5" fill="#1a1a1a">Has this beam settled since last month?</text>
  <text x="200" y="412" text-anchor="start" font-size="11.5" fill="#555555">total station, or dial gauges</text>
  <g>
    <line x1="60" y1="92" x2="60.0" y2="396.0" stroke="#b6c2cc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="60,406 55.0,396.0 65.0,396.0" fill="#b6c2cc"/>
  </g>
  <text x="42" y="168" text-anchor="middle" font-size="11.5" fill="#555555">M</text>
  <text x="42" y="186" text-anchor="middle" font-size="11.5" fill="#555555">O</text>
  <text x="42" y="204" text-anchor="middle" font-size="11.5" fill="#555555">R</text>
  <text x="42" y="222" text-anchor="middle" font-size="11.5" fill="#555555">E</text>
  <text x="42" y="268" text-anchor="middle" font-size="11.5" fill="#555555">C</text>
  <text x="42" y="286" text-anchor="middle" font-size="11.5" fill="#555555">O</text>
  <text x="42" y="304" text-anchor="middle" font-size="11.5" fill="#555555">S</text>
  <text x="42" y="322" text-anchor="middle" font-size="11.5" fill="#555555">T</text>
  <rect x="30" y="442" width="840" height="44" rx="8" fill="#eef3f8" stroke="#d5dfe8" stroke-width="1"/>
  <text x="450.0" y="460" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Accuracy you do not need is wasted money. Accuracy you do need and did not buy is a failure</text>
  <text x="450.0" y="477" text-anchor="middle" font-size="12.5" fill="#1a1a1a">you will not find out about until it matters.</text>
</svg>
