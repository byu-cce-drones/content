<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="900" height="366" fill="#f9f9f9" rx="8"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Figure 4: From the SD card to °C on a map</text>
  <text x="450.0" y="46" text-anchor="middle" font-size="12" fill="#555555">The iTwin route for Autel thermal photos. iTwin only ever sees grey levels; the scale file turns them back into °C.</text>
  <rect x="28.0" y="112" width="158" height="104" rx="10" fill="#eef1f4" stroke="#8a96a3" stroke-width="2"/>
  <text x="107.0" y="138" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">SD card</text>
  <text x="107.0" y="162" text-anchor="middle" font-size="12.5" fill="#555555">your whole</text>
  <text x="107.0" y="179" text-anchor="middle" font-size="12.5" fill="#555555">flight folder,</text>
  <text x="107.0" y="196" text-anchor="middle" font-size="12.5" fill="#555555">nothing renamed</text>
  <rect x="256.6666666666667" y="112" width="158" height="104" rx="10" fill="#e8f1fb" stroke="#4a90d9" stroke-width="2"/>
  <text x="335.6666666666667" y="138" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">Python notebook</text>
  <text x="335.6666666666667" y="162" text-anchor="middle" font-size="12.5" fill="#555555">05_itwin_export</text>
  <text x="335.6666666666667" y="179" text-anchor="middle" font-size="12.5" fill="#555555">drops bad frames,</text>
  <text x="335.6666666666667" y="196" text-anchor="middle" font-size="12.5" fill="#555555">one °C scale</text>
  <rect x="485.33333333333337" y="112" width="158" height="104" rx="10" fill="#fdf3e6" stroke="#d9822b" stroke-width="2"/>
  <text x="564.3333333333334" y="138" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">iTwin Capture</text>
  <text x="564.3333333333334" y="162" text-anchor="middle" font-size="12.5" fill="#555555">aerotriangulation,</text>
  <text x="564.3333333333334" y="179" text-anchor="middle" font-size="12.5" fill="#555555">Orthophoto/DSM,</text>
  <text x="564.3333333333334" y="196" text-anchor="middle" font-size="12.5" fill="#555555">colour correction off</text>
  <rect x="714.0" y="112" width="158" height="104" rx="10" fill="#e6f4ea" stroke="#2f8f4e" stroke-width="2"/>
  <text x="793.0" y="138" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1a1a1a">QGIS</text>
  <text x="793.0" y="162" text-anchor="middle" font-size="12.5" fill="#555555">Raster Calculator:</text>
  <text x="793.0" y="179" text-anchor="middle" font-size="12.5" fill="#555555">grey → °C,</text>
  <text x="793.0" y="196" text-anchor="middle" font-size="12.5" fill="#555555">pseudocolour</text>
  <g>
    <line x1="192.0" y1="164.0" x2="240.66666666666669" y2="164.0" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="250.66666666666669,164.0 240.66666666666669,169.0 240.66666666666669,159.0" fill="#333333"/>
  </g>
  <text x="221.33333333333334" y="86" text-anchor="middle" font-size="12" font-weight="bold" font-family="Consolas, 'Courier New', monospace" fill="#1a1a1a">.irg  .TIFF</text>
  <text x="221.33333333333334" y="102" text-anchor="middle" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a1a">.jpg  .mrk</text>
  <line x1="221.33333333333334" y1="108" x2="221.33333333333334" y2="158.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="2 3"/>
  <g>
    <line x1="420.6666666666667" y1="164.0" x2="469.33333333333337" y2="164.0" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="479.33333333333337,164.0 469.33333333333337,169.0 469.33333333333337,159.0" fill="#333333"/>
  </g>
  <text x="450.0" y="86" text-anchor="middle" font-size="12" font-weight="bold" font-family="Consolas, 'Courier New', monospace" fill="#1a1a1a">itwin_images</text>
  <text x="450.0" y="102" text-anchor="middle" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a1a">IRX_nnnn.tif</text>
  <line x1="450.0" y1="108" x2="450.0" y2="158.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="2 3"/>
  <g>
    <line x1="649.3333333333334" y1="164.0" x2="698.0" y2="164.0" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="708.0,164.0 698.0,169.0 698.0,159.0" fill="#333333"/>
  </g>
  <text x="678.6666666666667" y="86" text-anchor="middle" font-size="12" font-weight="bold" font-family="Consolas, 'Courier New', monospace" fill="#1a1a1a">orthophoto</text>
  <text x="678.6666666666667" y="102" text-anchor="middle" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a1a">GeoTIFF, grey</text>
  <line x1="678.6666666666667" y1="108" x2="678.6666666666667" y2="158.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M 335.6666666666667 216 L 335.6666666666667 270 L 793.0 270 L 793.0 228" fill="none" stroke="#4a90d9" stroke-width="2.2" stroke-dasharray="7 5"/>
  <path d="M 786.0 230 L 793.0 218 L 800.0 230 Z" fill="#4a90d9"/>
  <circle cx="335.6666666666667" cy="216" r="3.5" fill="#4a90d9"/>
  <rect x="436.33333333333337" y="255" width="256" height="30" rx="6" fill="#f9f9f9"/>
  <text x="564.3333333333334" y="275" text-anchor="middle" font-size="13.5" font-weight="bold" font-family="Consolas, 'Courier New', monospace" fill="#4a90d9">temperature_scale.json</text>
  <text x="564.3333333333334" y="300" text-anchor="middle" font-size="12" fill="#555555">the grey-to-°C formula and the ground pixel size; keep it with your results</text>
  <text x="450.0" y="348" text-anchor="middle" font-size="12" font-style="italic" fill="#555555">Temperatures come from the .irg and .TIFF files. The .jpg holds only the GPS position and a coloured picture.</text>
</svg>
